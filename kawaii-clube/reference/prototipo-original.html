<!DOCTYPE html>
<html lang="pt-BR" data-plan="nobreza">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kawaii · Suas oportunidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

:root{
  --font-serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --font-body:'Figtree','Segoe UI','Helvetica Neue',sans-serif;
  --color-bg-page:#FDF8F2; --color-bg-card:#FFFFFF; --color-gold:#A87A1C; --color-gold-soft:#F4C977;
  --color-text-primary:#3A2416; --color-text-secondary:#6E5240; --color-text-muted:#94796A; --color-text-button:#FFFFFF;
  --color-border:#EADFCF; --color-border-canvas:#E2D3BD; --color-divider:#F1E8DA; --color-label:#7F573C;
  --color-success:#2F6B3F; --color-success-bg:#E8F2EA; --color-warning:#8A5A12; --color-warning-bg:#FBF0DA; --color-error:#9B1C1C; --color-error-bg:#FBE9E9;
  --color-brand:#6A0003; --color-brand-dark:#4A0002; --color-brand-surface:#F8E9E6; --color-bg-deep:#3B0A0A; --color-text-heading:#4A0002;
  --color-skel:#F1E8DA;
  --radius-btn:9px; --radius-card:13px; --radius-xl:14px; --radius-full:999px;
  --shadow-md:0 6px 20px rgba(68,0,1,.10);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-bg-page:#1C1310; --color-bg-card:#261A15; --color-gold:#E3B45A;
  --color-text-primary:#F3E7DA; --color-text-secondary:#CDB8A5; --color-text-muted:#A08976;
  --color-border:#3D2C23; --color-border-canvas:#3A2A21; --color-divider:#33251E; --color-label:#D9B48C;
  --color-success:#8FD0A0; --color-success-bg:#1F3326; --color-warning:#F0C46E; --color-warning-bg:#3A2B12; --color-error:#F2A3A3; --color-error-bg:#3D1C1C;
  --color-brand:#B8282C; --color-brand-dark:#962023; --color-brand-surface:#3A1A18; --color-bg-deep:#2A0B0B; --color-text-heading:#F6D9CF; --color-skel:#33251E;
  --shadow-md:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --color-bg-page:#1C1310; --color-bg-card:#261A15; --color-gold:#E3B45A;
  --color-text-primary:#F3E7DA; --color-text-secondary:#CDB8A5; --color-text-muted:#A08976;
  --color-border:#3D2C23; --color-border-canvas:#3A2A21; --color-divider:#33251E; --color-label:#D9B48C;
  --color-success:#8FD0A0; --color-success-bg:#1F3326; --color-warning:#F0C46E; --color-warning-bg:#3A2B12; --color-error:#F2A3A3; --color-error-bg:#3D1C1C;
  --color-brand:#B8282C; --color-brand-dark:#962023; --color-brand-surface:#3A1A18; --color-bg-deep:#2A0B0B; --color-text-heading:#F6D9CF; --color-skel:#33251E;
  --shadow-md:0 6px 20px rgba(0,0,0,.35); color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg-page);color:var(--color-text-primary);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══ styles/globals.css — tokens complementares ═══ */
:root{--radius-xs:4px;--radius-sm:8px;
  --m-exchange-bg:#FEF3DF;--m-exchange-fg:#7A4E0A;--m-support-bg:#EAF2E8;--m-support-fg:#2F5E36;--m-collab-bg:#EDE8F5;--m-collab-fg:#4D3B7A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-exchange-bg:#3A2B1E;--m-exchange-fg:#F4C977;--m-support-bg:#22301F;--m-support-fg:#A9D5A0;--m-collab-bg:#2C2538;--m-collab-fg:#CDBDF0}}
:root[data-theme="dark"]{--m-exchange-bg:#3A2B1E;--m-exchange-fg:#F4C977;--m-support-bg:#22301F;--m-support-fg:#A9D5A0;--m-collab-bg:#2C2538;--m-collab-fg:#CDBDF0}
:root{--color-on-deep:#FDF8F2;--on-deep-rgb:253,248,242}
:root{--gold-rgb:244,201,119;--shadow-lg:0 24px 60px rgba(68,0,1,.14);--color-success-on-deep:#8FD0A0}
:root[data-theme="dark"]{--shadow-lg:0 24px 60px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow-lg:0 24px 60px rgba(0,0,0,.45)}}
:root{--radius-md:12px;--radius-lg:20px}
/* ═══ styles/motion.css — Motion tokens ═══ */
:root{
  --dur-hover:160ms; --dur-chip:200ms; --dur-card:300ms; --dur-swap:240ms;
  --dur-step:320ms; --dur-panel:340ms; --dur-success:420ms;
  --ease-editorial:cubic-bezier(.22,1,.36,1);
  --ease-functional:cubic-bezier(.4,0,.2,1);
  --ease-exit:cubic-bezier(.4,0,1,1);
  --stagger:55ms; --rise:10px;
}
@media (max-width:640px){:root{--rise:6px;--stagger:40ms}}

/* reveal: só na primeira entrada (controlado em lib/motion) */
.kw-reveal{animation:kw-rise var(--dur-card) var(--ease-editorial) both;animation-delay:calc(var(--i,0) * var(--stagger))}
@keyframes kw-rise{from{opacity:0;transform:translateY(var(--rise))}}
.kw-fade{animation:kw-fade var(--dur-swap) var(--ease-functional) both}
@keyframes kw-fade{from{opacity:0}}
.kw-step-fwd{animation:kw-step-f var(--dur-step) var(--ease-editorial) both}
.kw-step-back{animation:kw-step-b var(--dur-step) var(--ease-editorial) both}
@keyframes kw-step-f{from{opacity:0;transform:translateX(14px)}}
@keyframes kw-step-b{from{opacity:0;transform:translateX(-14px)}}
.kw-swap{animation:kw-swap var(--dur-chip) var(--ease-functional) both}
@keyframes kw-swap{from{opacity:0;transform:translateY(3px)}}

/* transições de página (View Transitions API, quando disponível) */
::view-transition-old(root){animation:kw-vt-out 160ms var(--ease-exit) both}
::view-transition-new(root){animation:kw-vt-in var(--dur-swap) var(--ease-editorial) both}
@keyframes kw-vt-out{to{opacity:0}}
@keyframes kw-vt-in{from{opacity:0;transform:translateY(6px)}}
::view-transition-group(opp-hero){animation-duration:var(--dur-step);animation-timing-function:var(--ease-editorial)}

@media (prefers-reduced-motion:reduce){
  .kw-reveal,.kw-fade,.kw-step-fwd,.kw-step-back,.kw-swap{animation:kw-fade 1ms both}
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-delay:0ms!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

/* ═══ styles/base.css ═══ */
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);height:100%}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--color-bg-page);color:var(--color-text-primary);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--color-gold);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px;background:var(--color-bg-deep);color:#fff;padding:10px 14px;border-radius:var(--radius-btn);z-index:50;transition:top var(--dur-hover) var(--ease-functional)}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 12px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--color-bg-page)}

/* tipografia */
.t-display{font-family:var(--font-serif);font-style:italic;font-weight:300;line-height:1.02;letter-spacing:-.01em;color:var(--color-text-heading)}
.t-h1{font-size:clamp(40px,6.2vw,76px)}
.t-h2{font-size:clamp(30px,3.6vw,40px);line-height:1.08}
.t-h3{font-size:26px;line-height:1.15}
.t-card{font-family:var(--font-display);font-weight:600;letter-spacing:-.015em;line-height:1.28;color:var(--color-text-primary)}
.t-num{font-family:var(--font-display);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--color-text-heading)}
.overline{font-size:13px;font-weight:600;color:var(--color-label);letter-spacing:.01em}
.lead{color:var(--color-text-secondary);max-width:56ch;font-size:16.5px;line-height:1.6}
.muted{color:var(--color-text-muted)}
.note{font-size:13px;color:var(--color-text-muted)}
/* ═══ layouts/AppShell ═══ */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--color-bg-page);border-bottom:1px solid var(--color-border-canvas)}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:28px}
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.04em;font-size:22px;color:var(--color-brand);background:none;border:none;cursor:pointer}
.nav{position:relative;display:flex;gap:2px;margin-right:auto}
.nav button{position:relative;background:none;border:none;padding:10px 12px;cursor:pointer;color:var(--color-text-secondary);font-weight:500;transition:color var(--dur-hover) var(--ease-functional);display:inline-flex;align-items:center;gap:6px}
.nav button:hover{color:var(--color-text-primary)}
.nav button[aria-current="page"]{color:var(--color-text-heading);font-weight:600}
.nav .sep{width:1px;background:var(--color-border-canvas);margin:8px 10px}
.indicator{position:absolute;bottom:-11px;left:0;height:2px;background:var(--color-brand);border-radius:2px;transform-origin:left;transition:transform var(--dur-step) var(--ease-editorial),width var(--dur-step) var(--ease-editorial),opacity var(--dur-chip)}
.count{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:var(--radius-full);background:var(--color-brand);color:#fff;font-size:11.5px;font-weight:600}
.count[hidden]{display:none}
.me{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--color-text-secondary)}
.me b{display:block;color:var(--color-text-primary);font-weight:600}
@media (max-width:820px){.me span{display:none}.bar-in{gap:12px;padding:10px 16px}.nav button{padding:10px 8px}}
@media (max-width:520px){.nav .lbl-long{display:none}}
.page{max-width:1240px;margin:0 auto;padding:40px 24px 120px}
@media (max-width:640px){.page{padding:28px 16px 110px}}

/* avatares */
.av{width:36px;height:36px;border-radius:var(--radius-full);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;flex-shrink:0;background:var(--color-brand);color:#fff}
.av.soft{background:var(--color-brand-surface);color:var(--color-brand)}
.av.co{border-radius:9px;background:var(--color-bg-deep);color:var(--color-gold-soft)}
.av.lg{width:56px;height:56px;font-size:19px}

/* ═══ components/Button ═══ */
.btn{border-radius:var(--radius-btn);padding:11px 18px;font-size:14.5px;font-weight:600;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;transition:background-color var(--dur-hover) var(--ease-functional),border-color var(--dur-hover) var(--ease-functional),color var(--dur-hover) var(--ease-functional),transform var(--dur-hover) var(--ease-functional)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--color-brand);color:var(--color-text-button)}
.btn-primary:hover{background:var(--color-brand-dark)}
.btn-ghost{background:transparent;border-color:var(--color-border-canvas);color:var(--color-text-secondary)}
.btn-ghost:hover{background:var(--color-brand-surface);border-color:var(--color-brand-surface);color:var(--color-text-heading)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.busy{cursor:progress}
.btn .arrow{transition:transform var(--dur-hover) var(--ease-functional)}
.btn:hover .arrow{transform:translateX(3px)}
.btn-link{background:none;border:none;color:var(--color-brand);cursor:pointer;font-weight:600;padding:6px 0;font-size:14px;text-underline-offset:3px}
.btn-link:hover{text-decoration:underline}
.btn.full{width:100%}
.btn-sm{min-height:36px;padding:7px 12px;font-size:13.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:kw-spin .7s linear infinite}
@keyframes kw-spin{to{transform:rotate(360deg)}}

/* pílulas: só selo de modalidade e status (regra do DS) */
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-full);white-space:nowrap}
.m-EXCHANGE{background:var(--m-exchange-bg);color:var(--m-exchange-fg)}
.m-SUPPORT{background:var(--m-support-bg);color:var(--m-support-fg)}
.m-COLLAB{background:var(--m-collab-bg);color:var(--m-collab-fg)}
.m-CONTRACT{background:var(--color-bg-deep);color:var(--color-gold-soft)}
.st{font-size:12px;font-weight:600;padding:3px 10px;border-radius:var(--radius-full);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ok{background:var(--color-success-bg);color:var(--color-success)}
.st-warn{background:var(--color-warning-bg);color:var(--color-warning)}
.st-err{background:var(--color-error-bg);color:var(--color-error)}
.st-neutral{background:var(--color-divider);color:var(--color-text-secondary)}
.st-brand{background:var(--color-brand-surface);color:var(--color-brand)}
.st-busy::before{animation:pulse .9s ease-in-out infinite}
.dot{width:20px;height:20px;border-radius:var(--radius-full);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.dot.ok{background:var(--color-success-bg);color:var(--color-success)}
.dot.inf{background:var(--color-warning-bg);color:var(--color-warning)}
.dot.miss{background:var(--color-error-bg);color:var(--color-error)}

/* ═══ features/opportunities — Hero editorial ═══ */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:48px;align-items:end;padding-bottom:36px;border-bottom:1px solid var(--color-border-canvas);position:relative}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero .t-h1{margin:12px 0 18px}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.moment{border-left:1px solid var(--color-border-canvas);padding-left:28px;display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){.moment{border-left:none;padding-left:0;border-top:1px solid var(--color-border-canvas);padding-top:20px;flex-direction:row;flex-wrap:wrap;gap:28px}}
.moment .t-num{font-size:40px;line-height:1}
.moment small{display:block;font-size:13.5px;color:var(--color-text-secondary);margin-top:4px}
.sprig{position:absolute;right:-8px;top:-18px;width:130px;color:var(--color-gold);opacity:.55;pointer-events:none}
@media (max-width:900px){.sprig{display:none}}

/* busca e abas */
.find{display:flex;flex-direction:column;gap:14px;margin:34px 0 8px}
.search{position:relative;max-width:640px}
.search input{width:100%;border:1px solid var(--color-border-canvas);border-radius:var(--radius-btn);padding:14px 44px 14px 46px;background:var(--color-bg-card);font-size:15.5px;transition:border-color var(--dur-hover) var(--ease-functional),box-shadow var(--dur-hover) var(--ease-functional)}
.search input:focus{outline:none;border-color:var(--color-brand);box-shadow:0 0 0 3px var(--color-brand-surface)}
.search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--color-text-muted)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;width:32px;height:32px;border-radius:var(--radius-btn);cursor:pointer;color:var(--color-text-muted)}
.search .clear:hover{background:var(--color-brand-surface)}
.tabs{position:relative;display:flex;gap:4px;border-bottom:1px solid var(--color-border-canvas);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;padding:12px 14px;cursor:pointer;color:var(--color-text-secondary);font-weight:500;white-space:nowrap;transition:color var(--dur-chip) var(--ease-functional)}
.tab:hover{color:var(--color-text-primary)}
.tab[aria-selected="true"]{color:var(--color-text-heading);font-weight:600}
.tab .n{font-size:12px;color:var(--color-text-muted);margin-left:5px;font-variant-numeric:tabular-nums}
.tabs .indicator{bottom:0}
.group{margin-top:36px}
.group-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.group-h h2{font-family:var(--font-display);font-weight:600;font-size:16px}
.group-h span{font-size:14px;color:var(--color-text-muted)}

/* ═══ OpportunityCard ═══ */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:18px}
.op{position:relative;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-card);display:flex;flex-direction:column;transition:border-color var(--dur-hover) var(--ease-functional),box-shadow var(--dur-swap) var(--ease-editorial),transform var(--dur-swap) var(--ease-editorial)}
.op:hover{border-color:var(--color-border-canvas);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.op:focus-within{border-color:var(--color-border-canvas)}
.op.selected{border-color:var(--color-brand);box-shadow:inset 0 0 0 1px var(--color-brand)}
.op-top{padding:20px 20px 0;display:flex;flex-direction:column;gap:12px}
.op-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.op-meta .rel{font-size:12.5px;color:var(--color-text-muted)}
.save{margin-left:auto;background:none;border:none;border-radius:var(--radius-btn);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--color-text-muted);transition:color var(--dur-hover) var(--ease-functional),background-color var(--dur-hover) var(--ease-functional)}
.save:hover{background:var(--color-brand-surface);color:var(--color-brand)}
.save[aria-pressed="true"]{color:var(--color-brand)}
.save.pop svg{animation:kw-pop var(--dur-success) var(--ease-editorial)}
@keyframes kw-pop{40%{transform:scale(1.18)}}
.op-title{font-size:18px}
.op-desc{font-size:14.5px;color:var(--color-text-secondary)}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-size:14px;font-weight:600}
.who small{display:block;font-size:12.5px;color:var(--color-text-secondary)}
.why{margin:16px 20px 0;padding:16px 16px 14px;border-radius:var(--radius-btn);background:var(--color-brand-surface);border-left:2px solid var(--color-brand)}
.why h4{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:19px;line-height:1.2;color:var(--color-text-heading);margin-bottom:10px}
.why ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.why li{display:grid;grid-template-columns:20px 1fr;gap:9px;font-size:14px;line-height:1.45}
.why .more{font-size:12.5px;color:var(--color-text-muted);margin-top:10px}
.op-foot{margin-top:auto;padding:16px 20px 20px;display:flex;gap:10px;align-items:center}

/* skeleton e vazio */
.skel{border-radius:var(--radius-card);background:var(--color-bg-card);border:1px solid var(--color-border);padding:20px;display:flex;flex-direction:column;gap:12px;min-height:356px}
.skel i{display:block;height:12px;border-radius:6px;background:var(--color-skel);animation:pulse 1.4s ease-in-out infinite}
.skel i.box{height:104px;border-radius:9px}
.skel i.btn{height:44px;margin-top:auto;border-radius:9px}
@keyframes pulse{50%{opacity:.5}}
.empty{display:grid;grid-template-columns:120px 1fr;gap:28px;align-items:center;max-width:680px;margin-top:36px;padding:32px;border:1px solid var(--color-border-canvas);border-radius:var(--radius-card)}
@media (max-width:560px){.empty{grid-template-columns:1fr;gap:16px}}
.empty svg{color:var(--color-gold);width:110px}
.empty h3{margin-bottom:8px}
.empty p{color:var(--color-text-secondary);margin-bottom:16px}
.empty.err{border-color:var(--color-error);background:var(--color-error-bg)}

.adm-main{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain}

/* ═══ Dashboard ═══ */
.adm-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

.mcard.deep{background:linear-gradient(140deg,var(--color-brand),var(--color-bg-deep));border-color:rgba(var(--gold-rgb),.3);color:var(--color-on-deep);box-shadow:var(--shadow-lg)}

.pill-lt{background:rgba(var(--on-deep-rgb),.16);color:var(--color-on-deep);font-size:12px;font-weight:700;padding:3px 10px;border-radius:var(--radius-full);text-transform:none;letter-spacing:0}
.mcard-h{color:var(--color-on-deep);font-size:30px;line-height:1.05}

.mcard.deep .btn{margin-top:16px;width:100%;min-height:42px;border-radius:var(--radius-md)}
.btn-light{background:var(--color-on-deep);color:var(--color-brand)}
.btn-light:hover{background:var(--color-gold-soft);color:var(--color-bg-deep)}
.adm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px;align-items:start}
.acard{background:var(--color-bg-card);border:1px solid var(--color-border-canvas);border-radius:var(--radius-lg);padding:28px}
.acard.span2{grid-column:span 2}
.acard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.acard-head.wrap{flex-wrap:wrap;align-items:center}
.acard-head.bordered{padding-bottom:18px;border-bottom:1px solid var(--color-border-canvas);margin-bottom:22px}
.acard-h{font-size:26px;line-height:1.1}
.acard-h.sm{font-size:23px}
.acard-head .muted{font-size:13px;margin-top:4px}
.chip-lt{font-size:12px;font-weight:700;color:var(--color-gold);background:var(--color-bg-page);padding:6px 12px;border-radius:var(--radius-md);white-space:nowrap}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:220px;padding:34px 0 8px;border-bottom:1px solid var(--color-divider)}
.bar-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.bar-col span{font-size:12px;color:var(--color-text-muted);font-weight:500}
.bar{position:relative;width:100%;height:calc(var(--h) * (100% - 26px));background:var(--color-brand);border-radius:var(--radius-md) var(--radius-md) 0 0;transform:scaleY(0);transform-origin:bottom;transition:transform var(--dur-step) var(--ease-editorial),opacity var(--dur-hover)}
.bar.grown{transform:none}
.bar:hover{opacity:.88}
.bar.peak{background:var(--color-bg-deep);box-shadow:var(--shadow-md)}
:root[data-theme="dark"] .bar.peak{background:var(--color-gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar.peak{background:var(--color-gold)}}
.bar::after{content:attr(data-v);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--color-text-primary);color:var(--color-bg-card);font-size:11px;font-weight:700;padding:3px 8px;border-radius:var(--radius-xs);white-space:nowrap;opacity:0;transition:opacity var(--dur-hover),transform var(--dur-hover) var(--ease-functional);pointer-events:none}

.acard-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:13px;color:var(--color-text-muted);flex-wrap:wrap}

.recent{list-style:none;display:flex;flex-direction:column;gap:10px}

/* ═══ Membros ═══ */

/* ═══ AdminModal ═══ */
dialog.modal.wide{width:min(640px,calc(100% - 32px))}

/* ═══ Início ═══ */
.u-welcome{position:relative;overflow:hidden;border-radius:var(--radius-card);padding:32px;color:var(--k-ivory);background:linear-gradient(90deg,var(--k-deep),var(--k-main) 55%,var(--k-soft));box-shadow:var(--shadow-lg)}
.u-glow{position:absolute;right:-60px;top:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(177,138,87,.22),transparent 65%);pointer-events:none}
.u-welcome-in{position:relative;max-width:680px}
.u-chip-gold{display:inline-block;background:rgba(177,138,87,.2);color:var(--k-gold);border:1px solid rgba(177,138,87,.3);font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:var(--radius-full)}
.u-welcome-h{font-family:var(--font-serif);font-size:clamp(26px,3.2vw,36px);font-weight:700;line-height:1.18;margin:12px 0 8px;color:var(--k-ivory)}
.u-welcome-p{font-size:14px;line-height:1.65;color:rgba(244,232,230,.9);margin-bottom:24px}
.u-welcome-p strong{color:var(--k-ivory)}
.u-welcome-act{display:flex;flex-wrap:wrap;gap:12px}
.btn-light{background:var(--k-ivory)!important;color:var(--k-deep)!important;box-shadow:var(--shadow-md)}
.btn-light:hover{background:var(--k-rose)!important}
.btn-light .icon{color:var(--k-main)}
.btn-outline-lt{background:rgba(106,0,4,.6)!important;color:var(--k-ivory)!important;border:1px solid rgba(177,138,87,.4)!important}
.btn-outline-lt:hover{background:var(--k-main)!important}
.u-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:32px 0}
.u-stat{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(79,0,4,.04);transition:box-shadow var(--dur-swap) var(--ease-editorial),transform var(--dur-swap) var(--ease-editorial)}
.u-stat:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.u-stat-l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-secondary)}
.u-stat-n{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--color-text-heading);margin:4px 0 6px;line-height:1.1}
.u-stat-ic{width:48px;height:48px;border-radius:var(--radius-md);background:var(--color-brand-surface);color:var(--color-brand);display:grid;place-items:center;flex-shrink:0}
:root[data-theme="dark"] .u-stat-ic{color:var(--color-gold)}
.u-tag{display:inline-block;font-size:11px;font-weight:500;padding:2px 7px;border-radius:var(--radius-xs)}
.u-tag.warn{background:var(--color-warning-bg);color:var(--color-warning)}
.u-tag.brand{background:var(--color-brand-surface);color:var(--color-brand)}
.u-tag.gold{background:rgba(177,138,87,.12);color:var(--color-gold)}
.u-home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;align-items:start}
.u-home-grid > section{grid-column:span 2}
.u-home-side{display:flex;flex-direction:column;gap:24px}
.u-sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.u-sec-h,.u-sec-head h2{font-family:var(--font-serif)!important;font-size:20px!important;font-weight:700!important;color:var(--color-text-heading)}
.u-sec-head span{font-size:12.5px;color:var(--color-text-muted)}
.u-sec-head .btn-link{font-size:12.5px;font-weight:700;display:inline-flex;gap:4px;align-items:center}
.u-card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:24px;box-shadow:0 1px 2px rgba(79,0,4,.04)}
.u-card-h{font-family:var(--font-serif);font-size:18px;font-weight:700;color:var(--color-text-heading);margin-bottom:16px}
.u-card-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.u-card-title{font-family:var(--font-serif);font-size:20px;font-weight:700;color:var(--color-text-heading)}
.u-card-title.sm{font-size:18px}
.u-card-top .muted{font-size:12.5px;margin-top:4px}
.u-todo{display:flex;flex-direction:column;gap:12px}
.u-todo-item{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--color-bg-page);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.u-todo-item b{display:block;font-size:12.5px;font-weight:600;color:var(--color-text-heading)}
.u-todo-item small{display:block;font-size:12px;color:var(--color-text-secondary);margin-top:2px}
.u-todo-item .btn-link{font-size:12px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px;padding:0}
.u-deep{background:var(--k-deep);color:var(--k-ivory);border-radius:var(--radius-card);padding:24px;box-shadow:0 1px 2px rgba(79,0,4,.08)}
:root[data-theme="dark"] .u-deep{background:var(--color-bg-alt);border:1px solid var(--color-border)}
.u-deep-over{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--k-gold)}
.u-deep-h{font-family:var(--font-serif);font-size:20px;font-weight:700;margin:6px 0 14px;color:var(--k-ivory)}
.u-steps{list-style:none;display:flex;flex-direction:column;gap:8px}
.u-steps li{display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(244,232,230,.6)}
.u-steps li i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(177,138,87,.5);margin:0 1px}
.u-steps li.done{color:var(--k-rose)}
.u-steps li.done .icon{color:var(--k-gold)}
.u-steps li.now{color:var(--k-ivory);font-weight:600}
.u-steps li.now i{background:var(--k-gold);border-color:var(--k-gold);box-shadow:0 0 0 4px rgba(177,138,87,.2)}
.u-deep-note{font-family:var(--font-serif);font-style:italic;font-size:13px;line-height:1.6;color:var(--k-rose);margin-top:14px}

/* ═══ Cards de oportunidade (referência) ═══ */
#results .group{display:block!important;margin-top:28px}
#results .group-h{display:flex!important;flex-direction:row!important;position:static!important;border-top:none!important;padding-top:0!important;margin-bottom:16px}
.u-cards,#results .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.u-cards.two{gap:16px}
@media (max-width:900px){.u-cards,#results .cards{grid-template-columns:1fr}}
.u-op{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:24px;box-shadow:0 1px 2px rgba(79,0,4,.04);display:flex;flex-direction:column;transition:box-shadow var(--dur-swap) var(--ease-editorial),transform var(--dur-swap) var(--ease-editorial),border-color var(--dur-hover)}
.u-op:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.u-op.selected{border-color:var(--color-brand)}
.u-op.compact{padding:20px}
.u-op-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.u-op-who{display:flex;align-items:center;gap:12px;min-width:0}
.u-op-av{width:56px;height:56px;border-radius:var(--radius-card);background:var(--color-brand-surface);color:var(--color-brand);border:2px solid rgba(177,138,87,.5);display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:18px;flex-shrink:0}
.u-op-av.co{background:var(--k-deep);color:var(--k-gold)}
.u-op-av.lg{width:64px;height:64px;font-size:20px;border-color:var(--k-gold)}
.u-op.compact .u-op-av{width:48px;height:48px;border-radius:50%;font-size:15px}
.u-op-name{font-family:var(--font-serif);font-size:18px;font-weight:700;color:var(--color-text-heading);line-height:1.2}
.u-op.compact .u-op-name{font-size:16px}
.u-op-biz{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-gold);margin-top:2px}
.u-op-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.u-op-title{font-family:var(--font-body)!important;font-size:13.5px!important;font-weight:600!important;color:var(--color-text-primary);line-height:1.45;margin-bottom:6px}
.u-op-desc{font-size:12.5px;line-height:1.65;color:var(--color-text-secondary);margin-bottom:4px}
.u-op-box{background:var(--color-bg-page);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:12px;margin:12px 0 14px}
.u-op-box-l{font-size:12px;font-weight:600;color:var(--color-text-secondary);margin-bottom:6px}
.u-op-box ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.u-op-box li{display:flex;gap:8px;font-size:12.5px;font-weight:500;color:var(--color-text-heading);line-height:1.5}
.u-op-more{font-size:11.5px;color:var(--color-text-muted);margin-top:6px}
.ev-ic{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0;margin-top:2px}
.ev-ic.ok{background:var(--color-success-bg);color:var(--color-success)}
.ev-ic.inf{background:var(--color-warning-bg);color:var(--color-warning)}
.ev-ic.miss{background:var(--color-error-bg);color:var(--color-error)}
.u-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.u-t{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--color-brand-surface);color:var(--color-brand)}
.u-t.muted{background:var(--color-bg-page);color:var(--color-text-secondary)}
:root[data-theme="dark"] .u-t{color:var(--k-rose)}
.u-op-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--color-divider);display:flex;justify-content:space-between;align-items:center;gap:10px}
.u-loc{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary)}
.u-loc .icon{color:var(--color-brand)}
.u-op-foot .btn-sm{min-height:36px;padding:8px 14px;font-size:12.5px}

/* filtros */
.u-filter{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(79,0,4,.04)}
.u-search{position:relative;width:min(384px,100%)}
.u-search > .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--color-text-secondary)}
.u-search input{width:100%;background:var(--color-bg-page);border:1px solid rgba(177,138,87,.3);border-radius:var(--radius-md);padding:10px 36px;font-size:12.5px;transition:border-color var(--dur-hover),box-shadow var(--dur-hover)}
.u-search input:focus{outline:none;border-color:var(--color-brand);box-shadow:0 0 0 3px var(--color-brand-surface)}
.u-search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;width:28px;height:28px;border-radius:8px;cursor:pointer;color:var(--color-text-muted)}
.u-chips{display:flex;flex-wrap:wrap;gap:8px;border:none!important;overflow:visible!important}
.u-chips .indicator{display:none}
.u-fchip{background:var(--color-bg-page);color:var(--color-text-secondary);border:1px solid var(--color-divider);padding:8px 14px;border-radius:var(--radius-md);font-size:12px;font-weight:600;cursor:pointer;transition:background-color var(--dur-chip) var(--ease-functional),color var(--dur-chip),border-color var(--dur-chip)}
.u-fchip:hover{color:var(--color-brand)}
.u-fchip[aria-selected="true"]{background:var(--color-brand);color:var(--k-ivory);border-color:var(--color-brand)}
.u-fchip .n{font-weight:600;color:inherit;opacity:.85}

/* ═══ Detalhe do match: modal central ═══ */
dialog.drawer{inset:0!important;margin:auto!important;height:auto!important;max-height:90vh!important;width:min(720px,calc(100% - 32px))!important;border:1px solid rgba(177,138,87,.3)!important;border-radius:var(--radius-card)!important;background:var(--color-bg-card)!important;box-shadow:var(--shadow-lg)}
dialog.drawer[open]{animation:kw-modal-in var(--dur-panel) var(--ease-editorial)!important}
dialog.drawer.closing{animation:kw-modal-out 180ms var(--ease-exit) forwards!important}
dialog.drawer::backdrop{background:rgba(79,0,4,.6)}
.m-close{position:absolute;top:16px;right:16px;z-index:2}
.m-body{padding:32px 32px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.m-head{display:flex;align-items:center;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--color-divider)}
.m-head-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.m-name{font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--color-text-heading)}
.m-h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-heading);margin-bottom:6px}
.m-box{background:var(--color-bg-page);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:14px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:4px}
.m-box small{color:var(--color-text-muted)}
.m-opp{font-weight:600;color:var(--color-text-heading)}
.m-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.m-list{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px}
.m-list li::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--color-gold);margin:0 8px 2px 0;vertical-align:middle}
.m-ev{list-style:none;background:var(--color-bg-page);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:4px 14px}
.m-ev li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-divider);font-size:13px}
.m-ev li:last-child{border-bottom:none}
.m-ev b{color:var(--color-text-heading)}
.m-ev p{color:var(--color-text-secondary);margin-top:2px}
.m-ev small{font-size:11.5px;color:var(--color-text-muted)}
.m-mod{background:rgba(244,232,230,.5);border:1px solid rgba(177,138,87,.2);border-radius:var(--radius-md);padding:12px 14px;color:var(--color-brand);font-size:13px}
:root[data-theme="dark"] .m-mod{background:var(--color-brand-surface);color:var(--k-rose)}
.m-mod ol{margin:6px 0 0 18px;color:var(--color-text-secondary)}
.m-foot{display:flex;align-items:center;gap:10px;padding:16px 32px calc(env(safe-area-inset-bottom,0px) + 16px);border-top:1px solid var(--color-divider);flex-wrap:wrap}
.m-foot .grow{flex:1}
.m-accept{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--color-bg-page);border-radius:var(--radius-md);padding:12px 14px}
.m-accept .lbl{display:block;font-size:11.5px;color:var(--color-text-muted)}
.m-accept b{font-size:13px;color:var(--color-text-heading);display:inline-flex;gap:5px;align-items:center}
.m-timeline{list-style:none;border-left:2px solid rgba(177,138,87,.4);padding-left:14px;display:flex;flex-direction:column;gap:12px}
.m-timeline b{font-size:12.5px;color:var(--color-text-heading)}
.m-timeline p{font-size:12.5px;color:var(--color-text-secondary)}
@media (max-width:640px){.m-body{padding:24px 20px 16px}.m-foot{padding:14px 20px}.m-two{grid-template-columns:1fr}.m-foot .btn{flex:1}.m-foot .grow{display:none}}

/* ═══ Perfil ═══ */
.u-profile{padding:32px}
.u-prof-head{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding-bottom:24px;border-bottom:1px solid var(--color-divider)}
.u-prof-who{display:flex;align-items:center;gap:16px}
.u-prof-av{width:80px;height:80px;border-radius:var(--radius-card);background:var(--k-main);color:var(--k-ivory);border:2px solid var(--k-gold);box-shadow:var(--shadow-md);display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:28px;flex-shrink:0}
.u-prof-name{font-family:var(--font-serif);font-size:24px;font-weight:700;color:var(--color-text-heading)}
.u-prof-role{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-gold);margin-top:2px}
.u-prof-loc{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--color-text-secondary);margin-top:4px}
.u-meter{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--color-text-secondary)}
.u-meter-bar{width:140px;height:5px;border-radius:3px;background:var(--color-divider);overflow:hidden}
.u-meter-bar i{display:block;height:100%;background:var(--color-gold);transform-origin:left;transition:transform var(--dur-step) var(--ease-editorial)}
.u-meter b{color:var(--color-text-heading)}
.u-prof-save{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.u-grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.u-sep-top{padding-top:24px;border-top:1px solid var(--color-divider)}
.u-profile .field label,.u-lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-heading);margin-bottom:8px}
.u-profile textarea{min-height:92px}
.u-checks{display:flex;flex-wrap:wrap;gap:8px}
.u-check{display:inline-flex;align-items:center;gap:8px;background:var(--color-bg-page);border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:8px 12px;font-size:12.5px;font-weight:500;cursor:pointer;transition:border-color var(--dur-chip),background-color var(--dur-chip)}
.u-check:has(input:checked){border-color:var(--color-brand);background:var(--color-brand-surface)}
.u-check input{accent-color:var(--k-main)}

/* ═══ Editor e tabela ═══ */
.doc-sub{font-size:13px;color:var(--color-text-secondary);margin:-6px 0 16px}
.paper{border-color:rgba(177,138,87,.3)!important;border-radius:var(--radius-card)!important}
.paper .t-h2{font-size:clamp(24px,3vw,30px)!important}
.table-wrap.flat th{background:rgba(247,243,236,.6)}
:root[data-theme="dark"] .table-wrap.flat th{background:var(--color-bg-alt)}
.av.sm{width:32px;height:32px;font-size:11px}
.btn-gold.btn-sm{min-height:34px}
.card,.policy{border-radius:var(--radius-card)}

/* ═══ responsivo: sidebar vira barra no topo (referência) ═══ */
@media (max-width:1279px){
  .u-shell{flex-direction:column}
  .u-side{width:100%;flex-direction:row;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;overflow:visible}
  .u-top{flex-direction:row;justify-content:space-between;align-items:center}
  .u-brand{flex-direction:row;margin:0;gap:12px;text-align:left}
  .u-mark{width:48px;height:48px;font-size:20px}
  .u-brand-t b{font-size:17px}
  .u-brand-t small{font-size:10px}
  .u-user,.u-nav,.u-foot{display:none}
  .u-mnav{display:flex;gap:4px}
  .u-mnav button{width:40px;height:40px;display:grid;place-items:center;background:none;border:none;color:var(--k-ivory);border-radius:var(--radius-md);cursor:pointer;transition:color var(--dur-hover),background-color var(--dur-hover)}
  .u-mnav button:hover{color:var(--k-gold)}
  .u-mnav button[aria-current="true"]{color:var(--k-gold);background:rgba(106,0,4,.6)}
  .u-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1024px){.u-home-grid{grid-template-columns:1fr}.u-home-grid > section{grid-column:auto}}
@media (max-width:720px){
  .u-header{padding:12px 16px}
  .u-crumb .k-over,.u-sep,.u-me > div{display:none}
  .u-me{border:none;padding:0}
  .u-content{padding:20px 16px 90px}
  .u-stats{grid-template-columns:1fr}
  .u-grid2{grid-template-columns:1fr}
  .u-profile{padding:20px}
  .u-brand-t{display:none}
  .u-pop{right:12px}
}
/* ═════════════════════════════════════════════════════════════════
   styles/theme.css — padrão unificado (referência Kawaii Clube)
   Playfair Display (títulos e números) + Inter (texto e interface)
   Paleta: deep #4F0004 · main #6A0004 · soft #891C26 · ivory #FFFDF7
           creme #F7F3EC · rose #F4E8E6 · gold #B18A57 · taupe #756963
   ═════════════════════════════════════════════════════════════════ */
:root{
  --font-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-body:'Inter','Segoe UI','Helvetica Neue',sans-serif;
  --k-deep:#4F0004; --k-main:#6A0004; --k-soft:#891C26; --k-ivory:#FFFDF7; --k-creme:#F7F3EC; --k-rose:#F4E8E6; --k-gold:#B18A57; --k-taupe:#756963; --k-charcoal:#282321;
  --color-bg-page:var(--k-creme); --color-bg-card:var(--k-ivory); --color-bg-alt:#EFECE6; --color-bg-deep:var(--k-deep);
  --color-side:var(--k-deep); --color-side-admin:#1B1716; --color-side-card:#241F1E; --color-side-border:#3A3230;

/* ═════════════════════════════════════════════════════════════════
   Kawaii · Central de Oportunidades + Clube de Conexões (protótipo)
   Organização espelha o kawaii-web (AGENTS.md):
   lib/ → infraestrutura · features/{domínio}/ → api, domain, adapters,
   views · app/ → roteamento e bootstrap. Dados fictícios, API simulada.
   ═════════════════════════════════════════════════════════════════ */

/* ── lib/format.ts ── */
const Fmt = {
  esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
  first: n => n.split(' ')[0],
  brl: cents => (cents / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'}),
  toCents: v => Math.round(parseFloat(String(v).replace(/\./g,'').replace(',','.')) * 100),
  date: iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', {day:'numeric', month:'long'}) : '',
  dateLong: iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'}) : '',
  time: iso => new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}),
  clock: iso => new Date(iso).toLocaleTimeString('pt-BR'),
  plural: (n, one, many) => `${n} ${n === 1 ? one : many}`,
};

/* ── lib/motion.ts — tokens + utilitários de movimento ── */
const Motion = {
  reducedQuery: matchMedia('(prefers-reduced-motion: reduce)'),
  get reduced(){ return this.reducedQuery.matches; },
  seen: new Set(),
  /** Stagger só na primeira entrada de um conjunto (não repete em refetch). */
  reveal(root, selector, key){
    if (!root || this.reduced) return;
    if (key && this.seen.has(key)) return;
    if (key) this.seen.add(key);
    root.querySelectorAll(selector).forEach((el, i) => {
      el.style.setProperty('--i', Math.min(i, 8));
      el.classList.add('kw-reveal');
      el.addEventListener('animationend', () => { el.classList.remove('kw-reveal'); el.style.removeProperty('--i'); }, {once:true});
    });
  },
  /** Reaplica uma classe de animação curta (crossfade, troca de etapa). */
  play(el, cls){
    if (!el || this.reduced) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), {once:true});
  },
  /** Continuidade entre telas: View Transitions quando disponível. */
  transition(update){
    if (!document.startViewTransition || this.reduced){ update(); return Promise.resolve(); }
    const safe = () => { try { update(); } catch (err) { console.error(err); throw err; } };
    return document.startViewTransition(safe).finished.catch(() => {});
  },
  /** Indicador deslizante para navegação, abas e subnavegação. */
  placeIndicator(container, activeSelector){
    if (!container) return;
    let bar = container.querySelector(':scope > .indicator');
    if (!bar){ bar = document.createElement('span'); bar.className = 'indicator'; bar.setAttribute('aria-hidden','true'); bar.style.transition = 'none'; container.appendChild(bar); requestAnimationFrame(() => requestAnimationFrame(() => bar.style.transition = '')); }
    const active = container.querySelector(activeSelector);
    if (!active){ bar.style.opacity = 0; return; }
    bar.style.opacity = 1;
    bar.style.width = active.offsetWidth + 'px';
    bar.style.transform = `translateX(${active.offsetLeft}px)`;
  },
  /** Fechamento de <dialog> com animação de saída. */
  closeDialog(dlg){
    if (!dlg?.open) return Promise.resolve();
    if (this.reduced){ dlg.close(); return Promise.resolve(); }
    return new Promise(res => {
      dlg.classList.add('closing');
      dlg.addEventListener('animationend', () => { dlg.classList.remove('closing'); dlg.close(); res(); }, {once:true});
    });
  },
};

/* ── lib/api/client.ts — formato { success, data } da Kawaii ── */
const Http = {
  wait: ms => new Promise(r => setTimeout(r, ms)),

  fail: (statusCode, code, message) => ({success:false, statusCode, code, message}),
};

/* ── lib/telemetry.ts — eventos do funil (sem PII) ── */
const Telemetry = {
  events: [],
  track(type, aggregateId, extra = {}){
    this.events.unshift({type, aggregateId, occurredAt:new Date().toISOString(), correlationId:'corr-' + Math.random().toString(36).slice(2,8), ...extra});
    Store.emit('telemetry');
  },
};

/* ── stores/app.store.ts — estado global mínimo com pub/sub ── */

  on(evt, fn){ (this.listeners[evt] ||= []).push(fn); },
  emit(evt){ (this.listeners[evt] || []).forEach(fn => fn()); },
};

const Proposal = {
  sections(draft){ const p = partnerLabel(OpportunitiesApi.byRef(draft.matchRef).candidate);
    return PROPOSAL_SECTIONS[draft.modality].map(s => ({...s, fields:s.fields.map(([key,label,type,required,hint]) => ({key, label:label.replace('{p}',p), type, required, hint}))})); },
  allFields(draft){ return this.sections(draft).flatMap(s => s.fields); },
  validateField(f, value){
    const v = String(value ?? '').trim();
    if (f.required && !v) return 'Preencha este campo.';
    if (v && f.type === 'int' && !/^\d+$/.test(v)) return 'Use só números inteiros.';
    if (v && f.type === 'money' && isNaN(Fmt.toCents(v))) return 'Use o formato 18,50.';
    return null;
  },
  validate(draft, values){ const e = {}; this.allFields(draft).forEach(f => { const m = this.validateField(f, values[f.key]); if (m) e[f.key] = m; }); return e; },
  total(values){ const c = Fmt.toCents(values.unitPrice), q = parseInt(values.quantity, 10); return (!isNaN(c) && !isNaN(q)) ? c * q : null; },
};

/* ═══ features/proposals/api (POST/PATCH /partnerships/proposal-drafts) ═══ */
const ProposalsApi = {
  drafts:{}, idem:{}, unsaved:{}, nextId:501,
  key: ref => `kw-${ME.id}-${ref.replace(/:/g,'-')}`,
  byRef(ref){ return Object.values(this.drafts).find(d => d.matchRef === ref); },
  async create(matchRef, idempotencyKey){
    await Http.wait(850);
    const f = Store.flags;
    if (f.down) return Http.fail(503,'SERVICE_UNAVAILABLE','O gerador de propostas não respondeu.');
    const rec = OpportunitiesApi.byRef(matchRef);
    if (!rec) return Http.fail(404,'MATCH_NOT_FOUND','Recomendação não encontrada.');
    if (f.stale){ Telemetry.track('MATCH_INVALIDATED', matchRef); return Http.fail(409,'OPPORTUNITY_NOT_ELIGIBLE','A oportunidade foi encerrada ou mudou de status depois da recomendação.'); }
    if (this.idem[idempotencyKey]){ const d = this.drafts[this.idem[idempotencyKey]]; Telemetry.track('PROPOSAL_DRAFT_REUSED', d.id); return Http.ok(d, {reused:true}); }
    const now = new Date().toISOString();
    const d = {id:this.nextId++, matchRef, modality:rec.modality, relation:rec.relation, status:'DRAFT', version:1, createdAt:now, updatedAt:now, fields:ProposalAdapter.fromRecommendation(rec)};
    this.drafts[d.id] = d; this.idem[idempotencyKey] = d.id;
    Telemetry.track('PROPOSAL_DRAFT_CREATED', d.id, {policyVersion:rec.policyVersion});
    return Http.ok(d);
  },
  async update(id, expectedVersion, values, status){
    await Http.wait(600);
    const f = Store.flags, d = this.drafts[id];
    if (f.down) return Http.fail(503,'SERVICE_UNAVAILABLE','Não foi possível salvar agora.');
    if (f.conflict){ d.version += 1; d.updatedAt = new Date().toISOString(); f.conflict = false; Store.emit('flags'); }
    if (d.version !== expectedVersion){ Telemetry.track('PROPOSAL_DRAFT_CONFLICT', id, {version:d.version}); return Http.fail(409,'VERSION_CONFLICT',`Este rascunho foi alterado em outra sessão e está na versão ${d.version}.`); }
    d.fields = {...values}; d.version += 1; d.updatedAt = new Date().toISOString(); if (status) d.status = status;
    Telemetry.track(status ? 'PROPOSAL_DRAFT_READY' : 'PROPOSAL_DRAFT_UPDATED', id, {version:d.version});
    return Http.ok(d);
  },
};
