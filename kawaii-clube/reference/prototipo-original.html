  {id:'SUPPORT', label:'Apoio', test:r => r.modality === 'SUPPORT'},
  {id:'EXCHANGE', label:'Permuta', test:r => r.modality === 'EXCHANGE'},
  {id:'COLLAB', label:'Collab', test:r => r.modality === 'COLLAB'},
  {id:'COMPANY', label:'Empresas', test:r => r.relation === 'COMPANY'}, /* filtro por relação, não por modalidade */
  {id:'SAVED', label:'Salvas', test:r => OpportunitiesApi.saved.has(r.matchRef)},
];
const OpportunitiesPage = {
  state:{status:'idle', list:[], error:null, tab:'ALL', query:''},
  render(){
    const drafts = Object.values(ProposalsApi.drafts);
    const s = this.state;
    return `<section class="hero" aria-labelledby="h-opps">
      <div class="hero-copy">
        <p class="overline">Central de Oportunidades</p>
        <h1 id="h-opps" class="t-display t-h1">Suas oportunidades</h1>
        <p class="lead">Parcerias alinhadas às necessidades do seu negócio. Cada recomendação mostra por que apareceu, de onde vem cada evidência e o que ainda precisa ser confirmado.</p>
        <div class="actions"><button class="btn btn-primary" id="to-results">Ver recomendações ${Icon.arrow}</button>${drafts.length ? `<button class="btn btn-ghost" data-nav="#/app/propostas">Continuar propostas</button>` : ''}</div>
      </div>
      <aside class="moment" aria-label="Seu momento">
        <div><span class="t-num" id="m-count">${s.status === 'ok' ? s.list.length : '—'}</span><small>oportunidades para você</small></div>
        <div><span class="t-num">${drafts.filter(d => d.status === 'DRAFT').length}</span><small>${drafts.filter(d => d.status === 'DRAFT').length === 1 ? 'rascunho em andamento' : 'rascunhos em andamento'}</small></div>
        <div><span class="t-num">${drafts.filter(d => d.status !== 'DRAFT').length}</span><small>prontas para envio</small></div>
      </aside>
      <div class="sprig">${Icon.sprig}</div>
    </section>
    <div class="find">
      <div class="search" role="search"><span class="ico">${Icon.search}</span><label class="sr" for="q">Buscar oportunidades</label>
        <input id="q" type="search" placeholder="Buscar oportunidades, serviços e empresas" value="${Fmt.esc(s.query)}" autocomplete="off">
        <button class="clear" id="q-clear" aria-label="Limpar busca" ${s.query ? '' : 'hidden'}>${Icon.close}</button></div>
      <div class="tabs" role="tablist" aria-label="Filtrar por modalidade ou tipo">${TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${s.tab === t.id}" aria-controls="results">${t.label}<span class="n" data-n="${t.id}"></span></button>`).join('')}</div>
    </div>
    <h2 id="results-h" class="sr">Recomendações</h2>
    <div id="results" role="tabpanel" aria-labelledby="tab-${s.tab}" aria-live="polite"></div>`;
  },
  mount(root){
    const q = $('#q', root), clear = $('#q-clear', root);
    let debounce;
    q.addEventListener('input', () => { this.state.query = q.value.trim(); clear.hidden = !this.state.query; clearTimeout(debounce); debounce = setTimeout(() => this.renderResults('filter'), 140); });
    $('#to-results', root).addEventListener('click', () => { $('.find').scrollIntoView({behavior:Motion.reduced ? 'auto' : 'smooth', block:'start'}); q.focus({preventScroll:true}); });
    clear.addEventListener('click', () => { q.value = ''; this.state.query = ''; clear.hidden = true; q.focus(); this.renderResults('filter'); });
    $$('[data-tab]', root).forEach(b => b.addEventListener('click', () => this.selectTab(b.dataset.tab)));
    $('.tabs', root).addEventListener('keydown', e => this.tabKeys(e));
    if (this.state.status === 'idle' || this.state.status === 'error') this.load(); else this.renderResults('restore');
    requestAnimationFrame(() => Motion.placeIndicator($('.tabs', root), '[aria-selected="true"]'));
    Motion.reveal(root, '.hero-copy > *, .moment > div', 'hero');
  },
  tabKeys(e){
    if (!['ArrowRight','ArrowLeft','Home','End'].includes(e.key)) return;
    const i = TABS.findIndex(t => t.id === this.state.tab);
    const n = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
    e.preventDefault(); this.selectTab(TABS[n].id); $(`#tab-${TABS[n].id}`).focus();
  },
  selectTab(id){
    this.state.tab = id;
    $$('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === id));
    $('#results').setAttribute('aria-labelledby', `tab-${id}`);
    Motion.placeIndicator($('.tabs'), '[aria-selected="true"]');
    this.renderResults('filter');
  },
  async load(){
    this.state.status = 'loading'; this.renderResults();
    const res = await OpportunitiesApi.list();
    Object.assign(this.state, res.success ? {status:'ok', list:res.data, error:null} : {status:'error', error:res});
    if (Router.current.page === this) { this.renderResults('first'); const m = $('#m-count'); if (m) m.textContent = this.state.status === 'ok' ? this.state.list.length : '—'; }
  },
  visible(){ const t = TABS.find(x => x.id === this.state.tab), q = this.state.query.toLowerCase();
    return this.state.list.filter(t.test).filter(r => !q || [r.opportunity.title, r.opportunity.text, r.candidate.name, r.candidate.role, r.explanation, ...r.candidate.offers].join(' ').toLowerCase().includes(q)); },
  updateCounts(){ TABS.forEach(t => { const el = $(`[data-n="${t.id}"]`); if (el) el.textContent = this.state.status === 'ok' ? this.state.list.filter(t.test).length : ''; }); },
  renderResults(mode){
    const box = $('#results'); if (!box) return;
    const s = this.state; this.updateCounts();
    if (s.status === 'loading' || s.status === 'idle'){
      box.setAttribute('aria-busy','true');
      box.innerHTML = `<div class="group"><div class="cards">${[0,1,2].map(() => '<div class="skel" aria-hidden="true"><i style="width:34%"></i><i style="width:88%;height:18px"></i><i style="width:62%"></i><i class="box"></i><i class="btn"></i></div>').join('')}</div><p class="sr">Carregando recomendações</p></div>`;
      return;
    }
    box.removeAttribute('aria-busy');
    if (s.status === 'error'){
      box.innerHTML = UI.empty({error:true, title:'As oportunidades não carregaram', text:`${Fmt.esc(s.error.message)} Nada mudou na sua conta. Código ${Fmt.esc(s.error.code)}.`, action:'<button class="btn btn-primary" id="retry">Tentar de novo</button>'});
      $('#retry').addEventListener('click', () => this.load()); Motion.play(box.firstElementChild, 'kw-fade'); return;
    }
    const list = this.visible();
    if (!s.list.length){
      box.innerHTML = UI.empty({title:'Ainda não há oportunidades para você', text:'Elas aparecem quando alguém tem evidências suficientes para combinar com os seus posts. Um post que diz claramente o que você oferece e o que precisa aumenta as chances.', action:'<button class="btn btn-ghost" data-toast="A criação de post fica no mural do App">Criar post no mural</button>'});
    } else if (!list.length){
      const saved = s.tab === 'SAVED' && !s.query;
      box.innerHTML = UI.empty({title: s.query ? `Nada encontrado para “${Fmt.esc(s.query)}”` : saved ? 'Nenhuma oportunidade salva' : 'Nenhuma oportunidade aqui', text: saved ? 'Use o marcador no canto de um card para guardar a oportunidade e voltar a ela depois.' : 'Tente outro termo ou outra aba.', action: s.query ? '<button class="btn btn-ghost" id="clear-search">Limpar busca</button>' : ''});
      $('#clear-search')?.addEventListener('click', () => { $('#q-clear').click(); });
    } else {
      const group = (id, title, sub) => { const items = list.filter(r => r.group === id); return items.length ? `<section class="group" aria-label="${title}"><div class="group-h"><h2>${title}</h2><span>${sub}</span></div><div class="cards">${items.map(r => this.card(r)).join('')}</div></section>` : ''; };
      box.innerHTML = group('mine','Para os seus posts','a partir do que você publicou') + group('invited','Você foi indicada','oportunidades em que o seu perfil combina');
      this.bindCards(box);
    }
    $$('[data-toast]', box).forEach(b => b.addEventListener('click', () => Toast.show(b.dataset.toast)));
    if (mode === 'first') Motion.reveal(box, '.op, .empty', 'cards-first');
    else if (mode === 'filter') Motion.play(box, 'kw-fade');
  },
  card(r){
    const d = ProposalsApi.byRef(r.matchRef), saved = OpportunitiesApi.saved.has(r.matchRef);
    const shown = r.evidence.slice(0, 2), rest = r.evidence.slice(2), restSummary = Evidence.summary(rest);
    return `<article class="op" data-ref="${r.matchRef}" aria-labelledby="t-${r.opportunityId}">
      <div class="op-top">
        <div class="op-meta">${UI.modalityPill(r.modality)}<span class="rel">${RELATION[r.relation]}</span>
          <button class="save" data-save aria-pressed="${saved}" aria-label="${saved ? 'Remover dos salvos' : 'Salvar oportunidade'}">${Icon.bookmark(saved)}</button></div>
        <h3 class="t-card op-title" id="t-${r.opportunityId}">${Fmt.esc(r.opportunity.title)}</h3>
        <p class="op-desc">${Fmt.esc(r.opportunity.text)}</p>
        <div class="who">${UI.avatar(r.candidate)}<div><b>${Fmt.esc(r.candidate.name)}</b><small>${Fmt.esc(r.candidate.role)} · ${Fmt.esc(r.candidate.place)}</small></div></div>
      </div>
      <div class="why"><h4>Por que essa oportunidade é relevante?</h4>
        <ul>${shown.map(e => `<li>${UI.evidenceDot(e)}<span>${Fmt.esc(e.text)}</span></li>`).join('')}</ul>
        ${rest.length ? `<p class="more">Mais ${rest.length} no detalhe${restSummary ? `: ${restSummary}` : ''}</p>` : ''}
      </div>
      <div class="op-foot">${d ? `${UI.draftStatus(d)}<button class="btn btn-ghost" data-open style="margin-left:auto">Continuar proposta ${Icon.arrow}</button>`
        : `<button class="btn btn-primary full" data-open>Ver oportunidade e iniciar proposta ${Icon.arrow}</button>`}</div>
    </article>`;
  },
  bindCards(box){
    $$('.op', box).forEach(card => {
      const ref = card.dataset.ref;
      $('[data-open]', card).addEventListener('click', () => {
        const d = ProposalsApi.byRef(ref);
        if (d) return App.navigate(`#/app/propostas/${d.id}`, {shared:$('.op-title', card)});
        MatchDrawer.open(ref, card);
      });
      const save = $('[data-save]', card);
      save.addEventListener('click', () => {
        const on = !OpportunitiesApi.saved.has(ref);
        on ? OpportunitiesApi.saved.add(ref) : OpportunitiesApi.saved.delete(ref);
        save.setAttribute('aria-pressed', on); save.setAttribute('aria-label', on ? 'Remover dos salvos' : 'Salvar oportunidade');
        save.innerHTML = Icon.bookmark(on); Motion.play(save, 'pop');
        this.updateCounts(); Toast.show(on ? 'Oportunidade salva' : 'Removida dos salvos');
        if (this.state.tab === 'SAVED' && !on) this.renderResults('filter');
      });
    });
  },
};

/* ═══ features/opportunities/components/MatchDrawer (Collabstr) ═══ */
const MatchDrawer = {
  el:null, sourceCard:null, ref:null,
  init(){
    this.el = document.getElementById('drawer');
    this.el.addEventListener('cancel', e => { e.preventDefault(); this.close(); });
    this.el.addEventListener('click', e => { if (e.target === this.el) this.close(); });
  },
  open(ref, card){
    this.ref = ref; this.sourceCard = card;
    const r = OpportunitiesApi.byRef(ref), c = r.candidate, p = POLICIES[r.modality];
    const n = k => Evidence.count(r.evidence, k);
    this.el.setAttribute('aria-labelledby', 'drawer-title');
    this.el.innerHTML = `
      <div class="drawer-head"><span class="overline">Detalhe da oportunidade</span><button class="icon-btn" data-close aria-label="Fechar detalhe">${Icon.close}</button></div>
      <div class="drawer-body">
        <section class="d-hero">${UI.modalityPill(r.modality)} <span class="note" style="margin-left:6px">${RELATION[r.relation]}</span>
          <h2 id="drawer-title" class="t-display t-h2">${Fmt.esc(r.opportunity.title)}</h2>
          <p>${Fmt.esc(r.opportunity.text)}</p><p class="note" style="margin-top:6px">Publicado por ${Fmt.esc(r.opportunity.owner)}</p></section>
        <section class="d-profile" aria-label="Possível parceira">${UI.avatar(c, 'lg')}<div><h3>${Fmt.esc(c.name)}</h3><p>${Fmt.esc(c.role)} · ${Fmt.esc(c.place)}</p><p style="margin-top:4px">${Fmt.esc(c.bio)}</p></div></section>
        <section class="facts" aria-label="Competências e necessidades">
          <div class="fact"><h4>${c.kind === 'company' ? 'O que a empresa oferece' : 'O que ela oferece'}</h4><ul>${c.offers.map(x => `<li>${Fmt.esc(x)}</li>`).join('')}</ul></div>
          <div class="fact"><h4>${c.kind === 'company' ? 'O que a empresa precisa' : 'O que ela procura'}</h4><ul>${c.needs.map(x => `<li>${Fmt.esc(x)}</li>`).join('')}</ul></div>
          <div class="fact"><h4>${c.termsLabel || 'Condições'}</h4><ul>${c.terms.map(x => `<li>${Fmt.esc(x)}</li>`).join('')}</ul></div>
        </section>
        <section class="ev-list" aria-labelledby="ev-h"><div class="group-h"><h2 id="ev-h">Por que essa oportunidade é relevante</h2></div>
          ${r.evidence.map(e => `<div class="ev">${UI.evidenceDot(e)}<div class="crit">${Fmt.esc(e.criterion)}<span class="tag ${EVIDENCE[e.status].cls}">${EVIDENCE[e.status].label}</span></div><div class="txt">${Fmt.esc(e.text)}</div><div class="src">Fonte: ${Fmt.esc(e.source)}</div></div>`).join('')}
        </section>
        <section class="policy"><h4>${p.title}</h4><ol>${p.rules.map(x => `<li>${x}</li>`).join('')}</ol></section>
        <p class="note" style="margin-top:14px">Política ${r.policyVersion}, avaliada em ${new Date(r.evaluatedAt).toLocaleDateString('pt-BR')}. Evidência a confirmar não conta como confirmada e nenhuma nota é exibida como chance de sucesso.</p>
      </div>
      <div class="drawer-foot">
        <div class="grow"><div class="tally"><span>${UI.evidenceDot({status:'confirmed'})}${n('confirmed')} confirmadas</span>${n('inferred') ? `<span>${UI.evidenceDot({status:'inferred'})}${n('inferred')} a confirmar</span>` : ''}${n('missing') ? `<span>${UI.evidenceDot({status:'missing'})}${n('missing')} faltando</span>` : ''}</div>
          <div id="drawer-msg" aria-live="polite"></div></div>
        <button class="btn btn-ghost" id="dismiss">Não tenho interesse</button>
        <button class="btn btn-primary" id="start">Iniciar proposta ${Icon.arrow}</button>
      </div>`;
    $$('.op.selected').forEach(x => x.classList.remove('selected')); card?.classList.add('selected');
    this.el.showModal();
    $('[data-close]', this.el).addEventListener('click', () => this.close());
    $('#start', this.el).addEventListener('click', e => this.start(e.currentTarget));
    $('#dismiss', this.el).addEventListener('click', e => this.dismiss(e.currentTarget));
    $('.drawer-body', this.el).scrollTop = 0;
    Motion.reveal(this.el, '.ev', null);
  },
  async close(){ await Motion.closeDialog(this.el); this.sourceCard?.classList.remove('selected'); this.sourceCard?.querySelector('[data-open]')?.focus(); },
  async start(btn){
    UI.busy(btn, 'Criando rascunho'); $('#drawer-msg').innerHTML = '';
    const res = await ProposalsApi.create(this.ref, ProposalsApi.key(this.ref));
    if (!res.success){
      UI.idle(btn);
      $('#drawer-msg').innerHTML = `<div class="alert err kw-swap" role="alert" style="margin-top:10px"><b>${res.statusCode === 409 ? 'Esta oportunidade não está mais disponível.' : 'O rascunho não foi criado.'}</b> ${Fmt.esc(res.message)} ${res.statusCode === 409 ? 'Nenhum rascunho foi criado.' : 'Repetir não duplica a proposta.'}</div>`;
      return;
    }
    if (res.reused) Toast.show('Rascunho existente aberto. Nenhuma proposta duplicada.');
    /* continuidade visual: o título da oportunidade vira o "Com base em" do documento */
    App.navigate(`#/app/propostas/${res.data.id}`, {shared:$('#drawer-title', this.el), before:() => { this.el.close(); this.sourceCard?.classList.remove('selected'); }});
  },
  async dismiss(btn){
    UI.busy(btn, 'Ocultando');
    await OpportunitiesApi.dismiss(this.ref);
    OpportunitiesPage.state.list = OpportunitiesPage.state.list.filter(r => r.matchRef !== this.ref);
    await Motion.closeDialog(this.el);
    OpportunitiesPage.renderResults('filter'); Toast.show('Oportunidade ocultada. Isso melhora as próximas recomendações.');
  },
};

/* ═══ features/proposals/views/ProposalEditor (PandaDoc) ═══ */
const ProposalEditor = {
  draft:null, step:'edit', saveState:'saved', msg:'',
  render(id){
    const d = ProposalsApi.drafts[id];
    if (!d) return UI.empty({title:'Rascunho não encontrado', text:'Ele pode ter sido criado em outra sessão desta demonstração. Abra uma oportunidade para começar uma proposta.', action:'<button class="btn btn-primary" data-nav="#/app/oportunidades">Ver oportunidades</button>'});
    this.draft = d; this.step = d.status === 'DRAFT' ? (this.draft === this._last ? this.step : 'edit') : 'done'; this._last = d; this.msg = '';
    this.saveState = ProposalsApi.unsaved[d.id] ? 'dirty' : 'saved';
    const r = OpportunitiesApi.byRef(d.matchRef), c = r.candidate;
    return `<button class="crumb" data-nav="#/app/oportunidades">${Icon.back} Suas oportunidades</button>
    <div class="ed-top" style="margin-top:10px">
      <ol class="stepper" aria-label="Etapas da proposta" id="stepper"></ol>
      <span class="savestate" id="savestate" role="status" aria-live="polite"></span>
    </div>
    <div class="editor">
      <div>
        <div id="ed-msg"></div>
        <article class="paper" aria-labelledby="doc-title">
          <p class="doc-kind">Proposta de parceria · ${MODALITY[d.modality]}</p>
          <h1 id="doc-title" class="t-display t-h2">Proposta para ${Fmt.esc(c.name)}</h1>
          <div class="parties"><div><small>De</small><b>${ME.name}</b><br>${ME.business}</div><div><small>Para</small><b>${Fmt.esc(c.name)}</b><br>${Fmt.esc(c.role)}</div>
            <div><small>Com base em</small><span id="doc-origin" style="view-transition-name:opp-hero">${Fmt.esc(r.opportunity.title)}</span></div></div>
          <div id="doc-body"></div>
        </article>
      </div>
      <aside class="rail" aria-label="Resumo e ações">
        <div class="card summary"><h3>Resumo da parceria</h3><dl id="summary"></dl></div>
        <div class="card"><h3 id="check-h">Antes de concluir</h3><ul class="check" id="checklist"></ul><div class="acts" id="actions"></div></div>
        <div class="card"><details><summary>Ver requisição enviada à API</summary><div class="code" id="payload"></div></details></div>
      </aside>
    </div>`;
  },
  mount(root){
    if (!this.draft || !$('#doc-body', root)) return;
    this.paint('init');
    setTimeout(() => { const o = $('#doc-origin'); if (o) o.style.viewTransitionName = ''; }, 600);
  },
  values(){ return ProposalsApi.unsaved[this.draft.id] || this.draft.fields; },
  paint(reason){
    this.paintStepper(); this.paintSave(); this.paintBody(reason); this.paintRail(); $('#ed-msg').innerHTML = this.msg;
  },
  paintStepper(){
    const steps = [['edit','Conteúdo'],['review','Revisão'],['done','Concluída']], at = steps.findIndex(s => s[0] === this.step);
    const finished = this.step === 'done';
    $('#stepper').innerHTML = steps.map(([id, label], i) => `${i ? `<span class="line ${i <= at ? 'done' : ''}" aria-hidden="true"><i></i></span>` : ''}<li class="${i < at || finished ? 'done' : i === at ? 'on' : ''}" ${i === at ? 'aria-current="step"' : ''}><span class="n">${i < at || finished ? '✓' : i + 1}</span>${label}</li>`).join('');
  },
  paintSave(){
    const d = this.draft, map = {saved:['', `Salvo às ${Fmt.time(d.updatedAt)} · versão ${d.version}`], dirty:['dirty','Alterações não salvas'], busy:['busy','Salvando…'], err:['err','Não salvo']};
    const [cls, text] = map[this.saveState], el = $('#savestate');
    if (el.dataset.text === text) return;
    el.className = `savestate ${cls}`; el.dataset.text = text; el.innerHTML = `<i aria-hidden="true"></i><span>${text}</span>`;
    Motion.play(el.lastElementChild, 'kw-swap');
  },
  paintBody(reason){
    const body = $('#doc-body'), d = this.draft, v = this.values();
    if (this.step === 'done'){
      body.innerHTML = `<section class="dsec done-block"><svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle class="ring" cx="28" cy="28" r="25"/><path class="tick" d="m18 29 7 7 13-15"/></svg>
        <h2 class="t-display t-h3">Revisão concluída</h2><p class="lead" style="margin-top:6px">A proposta está pronta para envio. Enviar é a próxima etapa do produto e exige a sua confirmação; o aceite acontece no chat, com as duas partes.</p></section>
        <div class="read">${Proposal.sections(d).map(s => this.readSection(s, v)).join('')}</div>`;
    } else if (this.step === 'review'){
      body.innerHTML = `<div class="read">${Proposal.sections(d).map(s => this.readSection(s, v)).join('')}</div>`;
    } else {
      body.innerHTML = `<form id="draft-form" novalidate>${Proposal.sections(d).map(s => this.editSection(s, v)).join('')}<button type="submit" hidden></button></form>`;
      this.bindForm();
    }
    if (reason === 'forward') Motion.play(body, 'kw-step-fwd');
    if (reason === 'back') Motion.play(body, 'kw-step-back');
  },
  editSection(s, v){
    const field = f => {
      const val = Fmt.esc(v[f.key]), req = f.required ? 'aria-required="true"' : '', desc = f.hint ? `aria-describedby="h-${f.key}"` : '';
      const ctl = f.type === 'area' ? `<textarea id="f-${f.key}" name="${f.key}" ${req} ${desc}>${val}</textarea>`
        : `<input id="f-${f.key}" name="${f.key}" ${req} ${desc} value="${val}" ${f.type === 'date' ? 'type="date"' : f.type === 'int' ? 'inputmode="numeric" type="text"' : f.type === 'money' ? 'inputmode="decimal" type="text"' : 'type="text"'}>`;
      return `<div class="field" data-field="${f.key}"><label for="f-${f.key}">${f.label}${f.required ? '' : ' <span class="opt">(opcional)</span>'}</label>${ctl}<span class="ok-mark" aria-hidden="true">${Icon.check}</span>${f.hint ? `<div class="hint" id="h-${f.key}">${f.hint}</div>` : ''}<div class="errmsg" id="e-${f.key}" hidden></div></div>`;
    };
    return `<section class="dsec"><h3>${s.title}</h3>${s.cols ? `<div class="cols">${s.fields.map(field).join('')}</div>` : s.fields.map(field).join('')}${s.total ? '<div class="totals" id="total" hidden><span>Valor total estimado</span><span class="t-num"></span></div>' : ''}</section>`;
  },
  readSection(s, v){
    const show = f => { const x = v[f.key]; const out = !x ? '<span class="missing">Não preenchido</span>' : f.type === 'date' ? Fmt.dateLong(x) : f.type === 'money' ? (isNaN(Fmt.toCents(x)) ? Fmt.esc(x) : Fmt.brl(Fmt.toCents(x))) : Fmt.esc(x); return `<div class="blk"><span class="lbl">${f.label}</span><p>${out}</p></div>`; };
    const total = s.total ? Proposal.total(v) : null;
    return `<section class="dsec"><h3>${s.title}</h3>${s.cols ? `<div class="cols">${s.fields.map(show).join('')}</div>` : s.fields.map(show).join('')}${total !== null ? `<div class="totals"><span>Valor total estimado</span><span class="t-num">${Fmt.brl(total)}</span></div>` : ''}</section>`;
  },
  bindForm(){
    const form = $('#draft-form'), d = this.draft;
    const fields = Proposal.allFields(d);
    const read = () => { const o = {...this.values()}; fields.forEach(f => o[f.key] = form.elements[f.key].value.trim()); return o; };
    form.addEventListener('input', e => {
      ProposalsApi.unsaved[d.id] = read(); this.saveState = 'dirty'; this.paintSave(); this.paintRail();
      const wrap = e.target.closest('.field'); if (wrap?.classList.contains('bad')) this.validateOne(wrap.dataset.field);
    });
    form.addEventListener('focusout', e => { const w = e.target.closest?.('.field'); if (w) this.validateOne(w.dataset.field, true); });
    form.addEventListener('submit', e => { e.preventDefault(); this.save(); });
    this.paintTotal();
  },
  validateOne(key, onBlur){
    const f = Proposal.allFields(this.draft).find(x => x.key === key), wrap = $(`[data-field="${key}"]`), err = $(`#e-${key}`), input = $(`#f-${key}`);
    if (!wrap) return;
    const msg = Proposal.validateField(f, input.value);
    wrap.classList.toggle('bad', !!msg); wrap.classList.toggle('valid', !msg && onBlur && !!input.value.trim());
    input.setAttribute('aria-invalid', !!msg);
    if (msg){ err.hidden = false; err.textContent = msg; input.setAttribute('aria-describedby', [`e-${key}`, f.hint ? `h-${key}` : ''].filter(Boolean).join(' ')); }
    else { err.hidden = true; if (f.hint) input.setAttribute('aria-describedby', `h-${key}`); else input.removeAttribute('aria-describedby'); }
    if (wrap.classList.contains('valid')) setTimeout(() => wrap.classList.remove('valid'), 1400);
    return !msg;
  },
  paintTotal(){ const t = $('#total'); if (!t) return; const total = Proposal.total(this.values()); t.hidden = total === null; if (total !== null) t.lastElementChild.textContent = Fmt.brl(total); },
  paintRail(){
    const d = this.draft, r = OpportunitiesApi.byRef(d.matchRef), v = this.values();
    const errors = Proposal.validate(d, v), nErr = Object.keys(errors).length, total = d.modality === 'CONTRACT' ? Proposal.total(v) : null;
    $('#summary').innerHTML = `<dt>Modalidade</dt><dd>${MODALITY[d.modality]}</dd><dt>Relação</dt><dd>${RELATION[d.relation]}</dd><dt>Prazo</dt><dd>${v.deadline ? Fmt.date(v.deadline) : '—'}</dd>${d.modality === 'CONTRACT' ? `<dt>Valor total</dt><dd>${total !== null ? Fmt.brl(total) : '—'}</dd>` : ''}<dt>Estado</dt><dd>${UI.draftStatus(d)}</dd>`;
    $('#checklist').innerHTML = `<li>${UI.evidenceDot({status:nErr ? 'missing' : 'confirmed'})}<span>${nErr ? `${Fmt.plural(nErr,'campo obrigatório vazio ou inválido','campos obrigatórios vazios ou inválidos')}` : 'Campos obrigatórios preenchidos'}</span></li>${r.evidence.filter(e => e.status !== 'confirmed').map(e => `<li>${UI.evidenceDot(e)}<span>Confirme com ${Fmt.esc(partnerLabel(r.candidate))}: ${Fmt.esc(e.criterion.toLowerCase())}</span></li>`).join('')}`;
    $('#check-h').textContent = this.step === 'done' ? 'Para combinar no envio' : 'Antes de concluir';
    const busy = this.saveState === 'busy' ? 'disabled' : '';
    $('#actions').innerHTML = {
      edit:`<button class="btn btn-primary" id="to-review" ${busy}>Revisar proposta ${Icon.arrow}</button><button class="btn btn-ghost" id="save" ${busy}>Salvar rascunho</button>`,
      review:`<button class="btn btn-primary" id="conclude" ${busy}>Concluir revisão</button><button class="btn btn-ghost" id="to-edit" ${busy}>Voltar e editar</button>`,
      done:`<button class="btn btn-primary" data-nav="#/app/propostas">Ver suas propostas</button><button class="btn btn-ghost" data-nav="#/app/oportunidades">Voltar às oportunidades</button>`,
    }[this.step] + `<p class="note" style="margin-top:4px">${this.step === 'done' ? 'O envio, o aceite e a entrega ficam registrados em Propostas.' : 'Concluir não envia. O envio pede a sua confirmação e o aceite das duas partes no chat.'}</p>`;
    $('#to-review')?.addEventListener('click', () => this.toReview());
    $('#save')?.addEventListener('click', () => this.save());
    $('#to-edit')?.addEventListener('click', () => this.go('edit', 'back'));
    $('#conclude')?.addEventListener('click', () => this.save('READY_FOR_REVIEW'));
    App.bindNav($('#actions'));
    $('#payload').textContent = `POST /partnerships/proposal-drafts\nIdempotency-Key: ${ProposalsApi.key(d.matchRef)}\n{ "matchRef": "${d.matchRef}",\n  "expectedPolicyVersion": "v1" }\n\nPATCH /partnerships/proposal-drafts/${d.id}\n{ "expectedVersion": ${d.version},\n  "fields": ${JSON.stringify(ProposalAdapter.toApiPayload(v), null, 2).replace(/\n/g, '\n  ')} }`;
    this.paintTotal();
  },
  go(step, dir){ this.step = step; this.msg = ''; this.paint(dir); window.scrollTo({top:0, behavior:Motion.reduced ? 'auto' : 'smooth'}); },
  toReview(){
    const keys = Proposal.allFields(this.draft).map(f => f.key), ok = keys.map(k => this.validateOne(k)).every(Boolean);
    if (!ok){ this.msg = `<div class="alert err kw-swap" role="alert" style="margin-bottom:14px"><b>Revise os campos marcados.</b> Eles são necessários para a proposta fazer sentido para a outra parte.</div>`; $('#ed-msg').innerHTML = this.msg; $('.field.bad input, .field.bad textarea')?.focus(); return; }
    this.go('review', 'forward');
  },
  async save(status){
    const d = this.draft, v = this.values();
    if (status && Object.keys(Proposal.validate(d, v)).length){ this.go('edit', 'back'); return this.toReview(); }
    this.saveState = 'busy'; this.paintSave(); this.paintRail();
    const res = await ProposalsApi.update(d.id, d.version, v, status);
    if (res.success){ delete ProposalsApi.unsaved[d.id]; this.saveState = 'saved'; Toast.show(status ? 'Revisão concluída' : 'Rascunho salvo');
      if (status) return this.go('done', 'forward');
      this.paintSave(); this.paintRail(); return; }
    this.saveState = 'err'; this.paintSave(); this.paintRail();
    this.msg = res.statusCode === 409
      ? `<div class="alert err kw-swap" role="alert" style="margin-bottom:14px"><b>Não salvamos para não apagar outra edição.</b> ${Fmt.esc(res.message)} <button class="btn-link" id="reload">Carregar a versão atual</button></div>`
      : `<div class="alert err kw-swap" role="alert" style="margin-bottom:14px"><b>Não foi possível salvar.</b> ${Fmt.esc(res.message)} As suas edições continuam na tela.</div>`;
    $('#ed-msg').innerHTML = this.msg;
    $('#reload')?.addEventListener('click', () => { delete ProposalsApi.unsaved[d.id]; this.saveState = 'saved'; this.msg = '<div class="alert warn kw-swap" style="margin-bottom:14px"><b>Versão atual carregada.</b> Refaça a sua alteração se ainda fizer sentido.</div>'; this.step = 'edit'; this.paint(); });
  },
};

  comunicacoes(){

    $$('[data-retry]', root).forEach(b => b.addEventListener('click', () => { const m = ClubApi.messages.find(x => x.id === b.dataset.retry); ClubApi.process(m, x => this.updateMsg(x)); }));

  updateMsg(m){
    const row = $(`[data-msg="${m.id}"]`); if (!row) return;

    this.bindMsgActions(row);
    Object.keys(MSG_STATUS).forEach(k => { const c = $(`[data-count="${k}"]`); if (c) c.textContent = ClubApi.messages.filter(x => x.status === k).length; });
    const btn = $('#process'), sched = ClubApi.messages.filter(x => x.status === 'SCHEDULED').length;
    if (btn && !btn.classList.contains('busy')){ btn.disabled = !sched; btn.textContent = `Processar fila (${sched})`; }

  async processQueue(btn){

    for (const m of queue){ await ClubApi.process(m, x => this.updateMsg(x)); }
    UI.idle(btn); btn.textContent = 'Processar fila (0)'; btn.disabled = true;
    Toast.show(`${Fmt.plural(queue.length,'mensagem processada','mensagens processadas')}`);

      <div id="node-detail"></div>`);
    $$('[data-node]', p).forEach(b => b.addEventListener('click', () => { this.node = b.dataset.node; $$('[data-node]', p).forEach(x => x.setAttribute('aria-pressed', x === b)); this.nodeDetail(true); }));

  nodeDetail(animate){
    const s = STAGES.find(x => x.id === this.node), who = ClubApi.members.filter(m => m.stage === s.id).map(m => m.name);
    const box = $('#node-detail');
    box.innerHTML = `<div class="node-detail"><div><h4>Gatilho</h4><p>${s.trigger}</p></div><div><h4>Condição</h4><p>${s.condition}</p></div><div><h4>Canal</h4><p>${s.channel}</p></div><div><h4>Espera</h4><p>${s.wait}</p></div></div>
      <p class="note" style="margin-top:12px">${who.length ? `Nesta etapa: ${who.map(Fmt.esc).join(', ')}.` : 'Nenhuma integrante nesta etapa agora.'}</p>`;
    if (animate) Motion.play(box, 'kw-swap');
  },

  eventos(){
    const p = this.panel(`<p class="lead" style="margin-bottom:18px">Inscrição não é presença: só o check-in conta como participação.</p><div class="events">${ClubApi.events.map(e => this.eventCard(e)).join('')}</div>`);
    $$('[data-checkin]', p).forEach(b => b.addEventListener('click', () => CheckinModal.open(b.dataset.checkin)));
    Motion.reveal(p, '.event', 'events');
  },
  eventCard(e){
    const d = new Date(e.date + 'T12:00:00'), present = e.attendees.length;
    const action = e.past ? `<button class="btn btn-ghost btn-sm" data-checkin="${e.id}">Ver presença</button>` : e.roster ? `<button class="btn btn-primary btn-sm" data-checkin="${e.id}">Abrir check-in</button>` : `<button class="btn btn-ghost btn-sm" disabled>Check-in abre no dia</button>`;
    return `<article class="event" data-event="${e.id}"><div class="date"><span class="t-num">${d.getDate()}</span><small>${d.toLocaleDateString('pt-BR', {month:'long'})} · ${e.format}</small></div>
      <h3 class="t-card" style="font-size:18px">${e.title}</h3>
      <div class="funnel"><div><b>${e.enrolled}</b>inscritas</div><div><b>${e.confirmed}</b>confirmadas</div><div><b data-present>${e.past || present ? present : '—'}</b>${e.past || present ? 'presentes' : 'após o check-in'}</div></div>
      <div>${action}</div></article>`;
  },
};

const CheckinModal = {
  el:null,
  init(){ this.el = document.getElementById('modal'); this.el.addEventListener('cancel', e => { e.preventDefault(); Motion.closeDialog(this.el); }); this.el.addEventListener('click', e => { if (e.target === this.el) Motion.closeDialog(this.el); }); },
  qr(seed){ let x = seed, cells = ''; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
    const finder = (cx, cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="none" stroke="currentColor"/><rect x="${cx + 2}" y="${cy + 2}" width="3" height="3" fill="currentColor"/>`;
    for (let i = 0; i < 21; i++) for (let j = 0; j < 21; j++){ const inF = (i < 8 && j < 8) || (i < 8 && j > 12) || (i > 12 && j < 8); if (!inF && rnd() > .55) cells += `<rect x="${j}" y="${i}" width="1" height="1"/>`; }
    return `<svg viewBox="-1 -1 23 23" fill="currentColor" role="img" aria-label="QR de exemplo para check-in">${finder(0,0)}${finder(14,0)}${finder(0,14)}${cells}</svg>`; },
  open(id){
    const e = ClubApi.events.find(x => x.id === id), roster = e.roster || e.attendees;
    this.el.innerHTML = `<div class="drawer-head"><span class="overline">${e.past ? 'Presença registrada' : 'Check-in'}</span><button class="icon-btn" data-close aria-label="Fechar">${Icon.close}</button></div>
      <div class="modal-body"><h2 class="t-display t-h3" style="margin-top:12px">${e.title}</h2>
      ${e.past ? '' : `<div class="qr">${this.qr(id.length * 7919)}<p class="note">QR de exemplo. Cada integrante lê com o celular ao chegar; a presença também pode ser registrada pela equipe abaixo.</p></div>`}
      <ul class="attend">${roster.map(n => { const on = e.attendees.includes(n); return `<li><span class="av soft" style="width:30px;height:30px;font-size:11px" aria-hidden="true">${n.split(' ').map(w => w[0]).slice(0,2).join('')}</span><span class="grow">${Fmt.esc(n)}</span>${e.past ? '<span class="st st-ok">Presente</span>' : `<button class="btn btn-sm ${on ? 'btn-ghost' : 'btn-primary'}" data-name="${Fmt.esc(n)}" aria-pressed="${on}">${on ? 'Presente' : 'Registrar presença'}</button>`}</li>`; }).join('')}</ul></div>`;
    this.el.showModal();
    $('[data-close]', this.el).addEventListener('click', () => Motion.closeDialog(this.el));
    $$('[data-name]', this.el).forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.name, on = !e.attendees.includes(n);
      on ? e.attendees.push(n) : e.attendees.splice(e.attendees.indexOf(n), 1);
      b.setAttribute('aria-pressed', on); b.className = `btn btn-sm ${on ? 'btn-ghost' : 'btn-primary'}`; b.textContent = on ? 'Presente' : 'Registrar presença'; Motion.play(b, 'kw-swap');
      const card = $(`[data-event="${id}"]`); if (card && card.classList.contains('ev-row')){ card.outerHTML = AdminPage.eventRow(e); const row = $(`[data-event="${id}"]`); $('[data-checkin]', row)?.addEventListener('click', () => CheckinModal.open(id)); } else if (card){ const fresh = document.createElement('div'); fresh.innerHTML = ClubPage.eventCard(e); card.querySelector('.funnel').replaceWith(fresh.querySelector('.funnel')); Motion.play(card.querySelector('[data-present]'), 'kw-swap'); }
    }));
  },
};

/* ═══ app/NotesPage — direção de arte, motion e revisões ═══ */
const NotesPage = {
  render(){
    const tokens = [['--dur-hover','160 ms','functional','Hover, botões, ícones'],['--dur-chip','200 ms','functional','Abas, chips, indicador de status'],['--dur-swap','240 ms','functional','Troca de conteúdo, crossfade'],['--dur-card','300 ms','editorial','Entrada de cards (stagger 55 ms)'],['--dur-step','320 ms','editorial','Etapas da proposta, indicador de navegação'],['--dur-panel','340 ms','editorial','Painel lateral e modal'],['--dur-success','420 ms','editorial','Confirmação de conclusão']];
    return `<p class="overline">Notas de design</p><h1 class="t-display t-h1" style="font-size:clamp(38px,5vw,60px);margin:10px 0 14px">Como este produto foi pensado</h1>
    <p class="lead">Direção de arte, sistema de movimento, arquitetura e as revisões de acessibilidade e performance. Um registro para quem continuar o projeto.</p>
    <div class="notes"><nav class="toc" aria-label="Nesta página">${[['direcao','Direção visual'],['auditoria','Auditoria'],['arquitetura','Arquitetura'],['motion','Sistema de motion'],['responsivo','Responsividade'],['a11y','Acessibilidade'],['perf','Performance'],['limites','Limitações']].map(([id, l]) => `<a href="#n-${id}" data-anchor>${l}</a>`).join('')}</nav>
    <div>
      <section class="nsec" id="n-direcao"><h2 class="t-display t-h2">Quiet confidence</h2>
        <p>A sofisticação vem da tipografia e do espaço, não de ornamento. Playfair Display carrega a voz editorial nos títulos e números; Inter resolve o texto e a interface. O sistema inteiro (login, empreendedora e equipe) usa a mesma paleta, os mesmos ícones e um modo noturno com a mesma lógica de cores. A ousadia está em um ponto só: o bloco “Por que essa oportunidade é relevante?”, que transforma a justificativa do match no centro do card. O documento da proposta trata a parceria como algo sério, com a aparência de um papel timbrado.</p>
        <p>São dois frontends atrás de um mesmo login. A empreendedora entra no App de Parcerias (Desafio 02); a equipe entra no painel do Clube de Conexões (Desafio 01). O papel vem do token, e os guards impedem que uma conta USER abra rotas de ADMIN.</p>
        <ul><li>Brella para descobrir: abas, salvas, recomendação com justificativa.</li><li>Collabstr para avaliar: perfil com oferta, necessidade e requisitos.</li><li>PandaDoc para formalizar: documento, resumo, estado de salvamento, etapas.</li><li>Customer.io, Circle e Luma para o Clube: jornada em nós, integrantes, check-in.</li></ul></section>
      <section class="nsec" id="n-auditoria"><h2 class="t-display t-h2">O que foi preservado</h2>
        <ul><li>Tokens semânticos do globals.css: canvas creme, bordô de ação, tom profundo, dourado só sobre escuro.</li><li><code>data-plan</code> muda a coroa, não o canvas; a visão da equipe usa <code>nobreza</code> fixo, como manda o AGENTS.md.</li><li>Raios: botão 9 px, card 13 px, superfície grande 14 px; pílula só em selo de modalidade e status.</li><li>Cartão em repouso sem sombra; a sombra quente aparece só no hover.</li><li>Gradiente apenas em superfície escura. Nada de glassmorphism, texto com gradiente ou cor literal em componente.</li></ul></section>
      <section class="nsec" id="n-arquitetura"><h2 class="t-display t-h2">Componentes e responsabilidades</h2>
        <p>O protótipo é um arquivo, mas o código está separado nas mesmas fronteiras do kawaii-web. Cada bloco vira um arquivo no porte para React.</p>
        <div class="tree">src/
  router/          index.tsx · RequireAuth · RequireAdmin (USER → /app, ADMIN → /admin)
  layouts/         AuthLayout · UserLayout · AdminLayout (barra lateral + navegação inferior no mobile)
  lib/
    motion/        tokens.css · reveal() · play() · transition() · placeIndicator()
    api/           client (envelope { success, data }) · telemetry
  features/
    opportunities/
      api/         recommendations.api.ts      GET /partnerships/recommendations
      domain/      policies.ts (Strategy por modalidade) · evidence.ts
      components/  OpportunityCard · OpportunityTabs · MatchDrawer
      pages/       OpportunitiesPage
    proposals/
      api/         proposal-drafts.api.ts      POST + PATCH com Idempotency-Key e versão
      adapters/    proposal.adapter.ts         recomendação → ProposalGenerationInput
      domain/      sections.ts · validation.ts
      components/  ProposalEditor · Stepper · SaveState · ProposalSummary
      pages/       ProposalsPage
    auth/
      api/         auth.api.ts                 POST /auth/login · /auth/register
      pages/       LoginPage (entrar e criar conta)
    home/          HomePage · ações pendentes · etapa da jornada
    profile/       ProfilePage · consentimento por canal · completude
    club/
      api/         club.api.ts                 consentimento, limite, fila de envio
      components/  MembersTable · MessagesTable · JourneyMap · EventCard · CheckinModal
      pages/       ClubPage
  stores/          auth.store.ts (sessão e papel) · app.store.ts (flags da demo)</div></section>
      <section class="nsec" id="n-motion"><h2 class="t-display t-h2">Sistema de motion</h2>
        <p>Duas curvas. <code>--ease-editorial</code> (0.22, 1, 0.36, 1) para entradas e revelações; <code>--ease-functional</code> (0.4, 0, 0.2, 1) para mudanças de estado. Saídas são mais curtas que entradas. Animo só <code>transform</code> e <code>opacity</code>.</p>
        <div class="table-wrap"><table><caption class="sr">Tokens de duração</caption><thead><tr><th scope="col">Token</th><th scope="col">Valor</th><th scope="col">Curva</th><th scope="col">Onde</th><th scope="col">Ver</th></tr></thead><tbody>${tokens.map(([t, v, e, w]) => `<tr><td class="log">${t}</td><td>${v}</td><td>${e}</td><td>${w}</td><td><button class="demo-track" data-demo="${t}" data-ease="${e}" aria-label="Ver ${t}"><i></i></button></td></tr>`).join('')}</tbody></table></div>
        <ul style="margin-top:16px"><li>Stagger de 55 ms só na primeira entrada; refetch, filtro e busca usam crossfade curto.</li><li>Do card ao painel, e do painel ao documento, o título da oportunidade é o elemento compartilhado (View Transitions).</li><li>Estados de envio mudam só quando a API simulada confirma; nenhuma animação simula sucesso.</li><li>Sem contadores que sobem do zero, sem bounce, sem parallax.</li></ul></section>
      <section class="nsec" id="n-responsivo"><h2 class="t-display t-h2">Responsividade</h2>
        <ul><li>Desktop: hero assimétrico, grid de cards, painel lateral de 620 px, editor com trilho fixo.</li><li>Mobile: painel vira folha de tela inteira com deslocamento vertical menor; stagger e distâncias reduzidos.</li><li>Áreas de toque de 44 px, safe-area respeitada, formulário funciona com teclado virtual.</li></ul></section>
      <section class="nsec" id="n-a11y"><h2 class="t-display t-h2">Acessibilidade</h2>
        <ul><li><code>prefers-reduced-motion</code>: sem deslocamento, sem stagger, View Transitions desligadas; feedback de estado continua visível.</li><li>Abas com setas, Home e End; painel e modal em <code>&lt;dialog&gt;</code> com foco preso, Esc e retorno do foco.</li><li>Campos com rótulo, <code>aria-invalid</code>, mensagens ligadas por <code>aria-describedby</code>; status de salvamento em região viva.</li><li>Cor nunca carrega sozinha o significado: evidência tem marca e texto; status tem rótulo.</li><li>Link “Pular para o conteúdo” e foco visível em dourado.</li></ul></section>
      <section class="nsec" id="n-perf"><h2 class="t-display t-h2">Performance</h2>
        <ul><li>Zero dependências de animação: CSS + View Transitions nativas. No porte para React, <code>motion/react</code> só se surgir transição de layout que o CSS não resolva.</li><li>Atualizações parciais: busca, filtros, salvamento e status de mensagem trocam só a região afetada, sem re-render da página.</li><li>Skeletons com a altura real dos cards evitam salto de layout.</li><li>Sombras só no hover e com transição curta.</li></ul></section>
      <section class="nsec" id="n-limites"><h2 class="t-display t-h2">Limitações</h2>
        <ul><li>API simulada e dados fictícios; nada aqui representa integração com produção.</li><li>Envio da proposta, aceite e entrega confirmada ficam como próximas etapas (P1).</li><li>Build, lint e testes do kawaii-web não rodaram: o repositório não estava disponível. O porte para React é o próximo passo.</li></ul></section>
    </div></div>`;
  },
  mount(root){
    $$('[data-anchor]', root).forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = document.querySelector(a.getAttribute('href')); t?.scrollIntoView({behavior:Motion.reduced ? 'auto' : 'smooth', block:'start'}); t?.querySelector('h2')?.setAttribute('tabindex','-1'); t?.querySelector('h2')?.focus({preventScroll:true}); }));
    $$('[data-demo]', root).forEach(b => b.addEventListener('click', () => {
      const i = b.firstElementChild, dur = getComputedStyle(document.documentElement).getPropertyValue(b.dataset.demo).trim();
      i.style.transition = `transform ${dur} var(--ease-${b.dataset.ease})`; b.classList.toggle('run');
    }));
  },
};

const ACCOUNTS = [
  {email:'vanessa@docesdavanessa.com.br', password:'kawaii123', user:{id:14, name:'Vanessa Moreira', business:'Doces da Vanessa', initials:'VM', role:'USER', plan:'nobreza'}},
  {email:'equipe@kawaiiclube.com.br', password:'kawaii123', user:{id:1, name:'Ellen Kois', business:'Equipe Kawaii', initials:'EK', role:'ADMIN', plan:'nobreza'}},
];
const AuthApi = {
  async login(email, password){
    await Http.wait(750);
    if (Store.flags.down) return Http.fail(503,'SERVICE_UNAVAILABLE','O serviço de login não respondeu. Tente de novo em instantes.');
    const acc = ACCOUNTS.find(a => a.email === email.trim().toLowerCase() && a.password === password);
    if (!acc) return Http.fail(401,'INVALID_CREDENTIALS','Email ou senha não conferem.');
    return Http.ok({accessToken:'demo.' + Math.random().toString(36).slice(2), user:{...acc.user}});
  },
  async register({name, business, email, password, wa, mail}){
    await Http.wait(850);
    if (ACCOUNTS.some(a => a.email === email.trim().toLowerCase())) return Http.fail(409,'EMAIL_IN_USE','Já existe uma conta com este email.');
    const initials = name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
    const user = {id:90 + ACCOUNTS.length, name, business, initials, role:'USER', plan:'nobreza', isNew:true, consent:{wa, mail}};
    ACCOUNTS.push({email:email.trim().toLowerCase(), password, user});
    return Http.ok({accessToken:'demo.' + Math.random().toString(36).slice(2), user:{...user}});
  },
};

  /* o perfil alimenta o match: informar nota fiscal resolve o requisito faltante da oportunidade de empresa */

};

  loginForm(){
    return `<p class="overline">Portal de acesso</p><h1 id="auth-h" class="t-display auth-h">Bem-vinda de volta</h1><p class="lead" style="font-size:15.5px">Entre para ver suas oportunidades ou, se você é da equipe, o painel do Clube.</p>
      <form id="login-form" class="auth-fields" novalidate>
        <div class="field" data-field="email"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="voce@seunegocio.com.br" required><div class="errmsg" id="e-email" hidden></div></div>
        <div class="field" data-field="password"><label for="password">Senha</label><div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required><button type="button" class="icon-btn pw-toggle" aria-label="Mostrar senha" aria-pressed="false">${Icon.eye}</button></div><div class="errmsg" id="e-password" hidden></div></div>
        <div class="auth-row"><label class="check-line"><input type="checkbox" name="remember"> Lembrar de mim</label><button type="button" class="btn-link" id="forgot">Esqueci a senha</button></div>
        <div id="auth-msg" aria-live="polite"></div>
        <button class="btn btn-primary full" type="submit" id="login-btn">Entrar ${Icon.arrow}</button>
      </form>
      <div class="divider"><span>ou entre com uma conta de demonstração</span></div>
      <div class="demo-accounts">
        <button class="acc" data-demo-login="0"><span class="av soft" aria-hidden="true">VM</span><span><b>Empreendedora</b><small>Vanessa · App de Parcerias</small></span></button>
        <button class="acc" data-demo-login="1"><span class="av co" aria-hidden="true">EK</span><span><b>Equipe Kawaii</b><small>Ellen Kois · Clube de Conexões</small></span></button>
      </div>
      <p class="auth-switch">Ainda não faz parte? <button class="btn-link" data-nav="#/cadastro">Criar conta</button></p>`;
  },
  registerForm(){
    return `<p class="overline">Nova integrante</p><h1 id="auth-h" class="t-display auth-h">Crie sua conta</h1><p class="lead" style="font-size:15.5px">Cadastre o seu negócio para começar a receber recomendações de parceria.</p>
      <form id="register-form" class="auth-fields" novalidate>
        <div class="cols"><div class="field" data-field="name"><label for="name">Seu nome</label><input id="name" name="name" autocomplete="name" required></div>
        <div class="field" data-field="business"><label for="business">Nome do negócio</label><input id="business" name="business" autocomplete="organization" required></div></div>
        <div class="field" data-field="email"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field" data-field="password"><label for="password">Senha</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="h-password"><button type="button" class="icon-btn pw-toggle" aria-label="Mostrar senha" aria-pressed="false">${Icon.eye}</button></div><div class="hint" id="h-password">Pelo menos 8 caracteres.</div></div>
        <fieldset class="consent-box"><legend>Como a Kawaii pode falar com você</legend>
          <label class="check-line"><input type="checkbox" name="wa" checked> WhatsApp, para lembretes curtos e convites</label>
          <label class="check-line"><input type="checkbox" name="mail" checked> Email, para conteúdos completos e agenda</label>
          <p class="note">Você pode mudar isso depois no seu perfil. Sem consentimento, não enviamos mensagens.</p></fieldset>
        <div id="auth-msg" aria-live="polite"></div>
        <button class="btn btn-primary full" type="submit" id="register-btn">Criar conta e completar perfil ${Icon.arrow}</button>
      </form>
      <p class="auth-switch">Já tem conta? <button class="btn-link" data-nav="#/entrar">Entrar</button></p>`;
  },
  mount(root){
    Motion.reveal(root, '.auth-inner > *', null);
    $$('.pw-toggle', root).forEach(b => b.addEventListener('click', () => { const i = b.previousElementSibling, show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.setAttribute('aria-pressed', show); b.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha'); b.innerHTML = show ? Icon.eyeOff : Icon.eye; }));
    $('#forgot', root)?.addEventListener('click', () => this.msg('ok', '<b>Pronto.</b> Se houver uma conta com esse email, enviamos um link para criar uma nova senha.'));
    $$('[data-demo-login]', root).forEach(b => b.addEventListener('click', () => { const a = ACCOUNTS[+b.dataset.demoLogin]; $('#email').value = a.email; $('#password').value = a.password; this.submitLogin(); }));
    $('#login-form', root)?.addEventListener('submit', e => { e.preventDefault(); this.submitLogin(); });

  msg(kind, html){ const m = $('#auth-msg'); m.innerHTML = `<div class="alert ${kind} kw-swap" ${kind === 'err' ? 'role="alert"' : ''} style="margin:4px 0 12px">${html}</div>`; },
  fieldError(key, text){ const w = $(`[data-field="${key}"]`), e = $(`#e-${key}`), i = $(`#${key}`); w?.classList.toggle('bad', !!text); i?.setAttribute('aria-invalid', !!text); if (e){ e.hidden = !text; e.textContent = text || ''; if (text) i.setAttribute('aria-describedby', `e-${key}`); } },
  async submitLogin(){
    const email = $('#email').value, password = $('#password').value;
    this.fieldError('email', /\S+@\S+\.\S+/.test(email) ? null : 'Informe um email válido.');
    this.fieldError('password', password ? null : 'Informe a sua senha.');

    const btn = $('#login-btn'); UI.busy(btn, 'Entrando'); $('#auth-msg').innerHTML = '';

  async submitRegister(){

  },
};

Motion.placeIndicatorV = function(container){
  if (!container) return;
  let bar = container.querySelector(':scope > .vind');
  if (!bar){ bar = document.createElement('span'); bar.className = 'vind'; bar.setAttribute('aria-hidden','true'); container.prepend(bar); }
  const prev = Motion.lastV; const active = container.querySelector('[aria-current="true"]');
  if (!active){ bar.style.opacity = 0; return; }
  if (prev != null && !this.reduced){ bar.style.transition = 'none'; bar.style.transform = `translateY(${prev}px)`; bar.style.height = active.offsetHeight + 'px'; void bar.offsetWidth; bar.style.transition = ''; }
  bar.style.opacity = 1; bar.style.height = active.offsetHeight + 'px'; bar.style.transform = `translateY(${active.offsetTop}px)`;
  Motion.lastV = active.offsetTop;
};

/* ═══ router/index.tsx — rotas, RequireAuth e RequireAdmin ═══ */
const Router = {
  current:{page:null},
  match(hash){
    const p = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean), role = AuthStore.role;
    if (p[0] === 'notas') return {page:NotesPage, public:true, title:'Notas de design', nav:null};
    if (p[0] === 'entrar' || p[0] === 'cadastro' || !p.length){
      if (role) return {redirect:AuthStore.home()};
      return {page:LoginPage, arg:p[0] || 'entrar', public:true, bare:true, title:p[0] === 'cadastro' ? 'Criar conta' : 'Entrar'};
    }
    if (!role) return {redirect:'#/entrar', reason:'auth'};                       /* RequireAuth */
    if (p[0] === 'admin'){
      if (role !== 'ADMIN') return {redirect:'#/app', reason:'admin'};           /* RequireAdmin */
      const tab = ADMIN_TITLES[p[1]] ? p[1] : 'dashboard'; return {page:AdminPage, arg:tab, nav:tab, title:ADMIN_TITLES[tab][0], admin:true};
    }
    if (p[0] === 'app'){
      if (role === 'ADMIN') return {redirect:'#/admin'};
      if (p[1] === 'perfil') return {page:ProfilePage, nav:'perfil', title:'Meu perfil profissional'};
      if (p[1] === 'oportunidades') return {page:OpportunitiesPage, nav:'opps', title:'Central de Oportunidades'};
      if (p[1] === 'propostas' && p[2]) return {page:ProposalEditor, arg:+p[2], nav:'props', title:'Proposta'};
      if (p[1] === 'propostas') return {page:ProposalsPage, nav:'props', title:'Minhas propostas'};
      return {page:HomePage, nav:'inicio', title:'Início e jornada'};
    }
    return {redirect:AuthStore.home()};
  },
  render(){
    let m = this.match(location.hash);
    if (m.redirect){ if (m.reason === 'admin') setTimeout(() => Toast.show('Essa área é só da equipe Kawaii.'), 50); history.replaceState(null, '', m.redirect); m = this.match(m.redirect); }
    const root = document.getElementById('root'); this.current = m;
    const content = m.page.render(m.arg);
    const shellOn = AuthStore.user && !m.bare;
    root.innerHTML = shellOn ? Layout.render(m.nav, content, m.title) : (m.bare ? content : `<main class="page" id="app" tabindex="-1"><button class="crumb" data-nav="${AuthStore.user ? AuthStore.home() : '#/entrar'}">${Icon.back} ${AuthStore.user ? 'Voltar ao app' : 'Voltar ao login'}</button>${content}</main>`);
    if (shellOn) Layout.mount(root);
    m.page.mount?.(root);
    App.bindNav(root);
    document.title = `Kawaii · ${m.title}`;
    $('#demo-btn').hidden = !AuthStore.user;
    const h = root.querySelector('h1'); if (h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); }
  },
};
Layout.refreshBadges = () => { NAV[AuthStore.role]?.forEach(i => { $$(`[data-navid="${i.id}"]`).forEach(b => { if (b.closest('.bnav, .adm-mnav, .u-mnav')) return; const v = i.badge?.(); let c = b.querySelector('.count'); if (v && !c){ c = document.createElement('span'); c.className = 'count'; b.appendChild(c); } if (c){ c.hidden = !v; c.textContent = v; } }); }); };

/* ═══ app/App.tsx ═══ */
const App = {
  navigate(hash, {shared, before} = {}){
    if (shared) shared.style.viewTransitionName = 'opp-hero';
    Motion.transition(() => {
      if (shared) shared.style.viewTransitionName = '';
      before?.();
      if (location.hash !== hash) history.pushState(null, '', hash);
      Router.render(); window.scrollTo(0, 0);
    });
  },
  bindNav(root){ $$('[data-nav]', root).forEach(el => { if (el.dataset.bound) return; el.dataset.bound = 1; el.addEventListener('click', e => { e.preventDefault(); App.navigate(el.dataset.nav); }); }); },
  initDemo(){
    const demo = $('#demo'), btn = $('#demo-btn');
    const sync = () => $$('[data-flag]', demo).forEach(c => c.checked = Store.flags[c.dataset.flag]);
    Store.on('flags', sync);

  /* ── Inscrições e eventos ── */
  view_inscricoes(){
    return `<section class="acard"><div class="acard-head wrap bordered"><div><p class="adm-kicker">Encontros, rodas e feiras</p><h2 class="t-display acard-h">Gestão de inscrições e rodadas</h2></div><button class="btn btn-primary" data-new-event>${AIcon.get('plus', 16)} Novo evento</button></div>

      <p class="note" style="margin-top:14px">Inscrição não é presença: só o check-in conta como participação.</p></section>`;
  },
  eventRow(e){
    const d = new Date(e.date + 'T12:00:00'), left = Math.max(0, (e.capacity || 0) - e.confirmed);
    const action = e.past ? `<button class="btn btn-ghost btn-sm" data-checkin="${e.id}">Ver presença</button>` : e.roster ? `<button class="btn btn-ghost btn-sm" data-checkin="${e.id}">Abrir check-in</button>` : `<button class="btn btn-ghost btn-sm" disabled>Check-in abre no dia</button>`;
    return `<article class="ev-row" data-event="${e.id}"><div><span class="pill-tag">${e.format}</span><h3 class="t-card ev-title">${Fmt.esc(e.title)}</h3><p class="muted">${d.toLocaleDateString('pt-BR', {day:'numeric', month:'long'})} · ${e.confirmed} confirmadas · ${e.past ? `${e.attendees.length} presentes` : `${left} ${left === 1 ? 'vaga restante' : 'vagas restantes'}`}</p></div>${action}</article>`;
  },
  mount_inscricoes(root){
    Motion.reveal(root, '.ev-row', 'adm-events');
    const bind = scope => $$('[data-checkin]', scope).forEach(b => b.addEventListener('click', () => CheckinModal.open(b.dataset.checkin)));
    bind(root);
    $('[data-new-event]', root).addEventListener('click', () => AdminModal.open({overline:'Novo evento', title:'Criar evento', submit:'Criar evento', body:`
      <div class="field"><label for="et">Nome do evento</label><input id="et" name="title" required></div>
      <div class="cols"><div class="field"><label for="ed">Data</label><input id="ed" name="date" type="date" required></div><div class="field"><label for="ec">Vagas</label><input id="ec" name="capacity" inputmode="numeric" value="30"></div></div>
      <div class="field"><label for="ef">Formato</label><select id="ef" name="format" class="select"><option>Online</option><option>Presencial</option><option>Rodada de negócios</option></select></div>`,
      onSubmit: async (f, err) => { if (!f.title.value.trim() || !f.date.value){ err('<b>Informe nome e data.</b>'); return false; } await Http.wait(450);
        const e = {id:'e-' + (ClubApi.events.length + 1), title:f.title.value.trim(), format:f.format.value, date:f.date.value, past:false, enrolled:0, confirmed:0, attendees:[], capacity:parseInt(f.capacity.value, 10) || 0};
        ClubApi.events.push(e); const box = $('#ev-rows'); if (box){ box.insertAdjacentHTML('beforeend', this.eventRow(e)); Motion.play(box.lastElementChild, 'kw-reveal'); } AdminToast.show('Evento criado. As inscrições abrem quando o convite for disparado.'); } }));

  /* ── Comunicações ── */
  view_comunicacoes(){
    return `<section class="acard"><div class="acard-head wrap bordered"><h2 class="t-display acard-h">Campanhas e avisos oficiais</h2><button class="btn btn-primary" data-broadcast>${AIcon.get('plane', 15)} Novo comunicado</button></div>
      <div class="ev-rows" id="camp-rows">${ClubApi.campaigns.map(c => this.campaignRow(c)).join('')}</div></section>
      <section class="acard" style="margin-top:20px"><div class="acard-head"><div><h2 class="t-display acard-h sm">Fila de mensagens automáticas</h2><p class="muted">Mensagens da jornada, por integrante, com o status confirmado pelo provedor.</p></div></div><div id="club-panel"></div></section>`;
  },
  campaignRow(c){ const s = MSG_STATUS[c.status]; return `<article class="ev-row" data-camp="${c.id}"><div><span class="pill-tag">${c.tag}</span><h3 class="t-card ev-title">${Fmt.esc(c.title)}</h3><p class="muted">${c.channel} · ${c.audience} integrantes com consentimento${c.opens ? ` · ${c.opens}` : ''}</p></div><span class="st ${s.cls}" data-camp-st>${c.status === 'DELIVERED' ? 'Concluído' : s.label}</span></article>`; },
  mount_comunicacoes(root){ ClubPage.comunicacoes(); $$('[data-broadcast]', root).forEach(b => b.addEventListener('click', () => this.broadcast())); },

  /* ── Novo disparo (modal da referência) ── */
  broadcast(){
    const seg = {all:['Todas as integrantes ativas', m => m.score >= 10], imperatriz:['Plano Imperatriz', m => m.plan === 'imperatriz'], majestade:['Plano Majestade', m => m.plan === 'majestade'], event:['Etapa: convidar para evento', m => m.stage === 'event']};
    const reach = (k, ch) => { const base = ClubApi.members.filter(seg[k][1]); return {total:base.length, ok:base.filter(m => ch === 'Email' ? m.email : m.wa).length}; };
    const el = AdminModal.open({overline:'Comunicação oficial', title:'Disparo para a comunidade', submit:'Disparar', body:`
      <div class="cols"><div class="field"><label for="bs">Segmento</label><select id="bs" name="seg" class="select">${Object.entries(seg).map(([k, [l]]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
      <div class="field"><label for="bc">Canal</label><select id="bc" name="channel" class="select"><option>WhatsApp</option><option>Email</option></select></div></div>
      <p class="reach" id="reach"></p>
      <div class="field"><label for="bt">Título</label><input id="bt" name="title" placeholder="Ex.: Novas oportunidades de parceria abertas"></div>
      <div class="field"><label for="bm">Mensagem</label><textarea id="bm" name="msg" rows="4" placeholder="Escreva o comunicado"></textarea></div>`,
      onSubmit: async (f, err) => {
        const r = reach(f.seg.value, f.channel.value);
        if (!f.title.value.trim() || !f.msg.value.trim()){ err('<b>Escreva título e mensagem.</b>'); return false; }
        if (!r.ok){ err('<b>Ninguém neste segmento autorizou este canal.</b> Escolha outro canal ou segmento.'); return false; }
        await Http.wait(500);
        const c = {id:'c-' + (ClubApi.campaigns.length + 1), tag:seg[f.seg.value][0], title:f.title.value.trim(), audience:r.ok, status:'SCHEDULED', channel:f.channel.value};
        ClubApi.campaigns.unshift(c); this.processCampaign(c);
        AdminToast.show(`Disparo agendado para ${Fmt.plural(r.ok,'integrante','integrantes')}${r.total - r.ok ? `; ${r.total - r.ok} sem consentimento ficaram de fora` : ''}.`);
        if (this.tab !== 'comunicacoes') App.navigate('#/admin/comunicacoes'); else { $('#camp-rows').insertAdjacentHTML('afterbegin', this.campaignRow(c)); Motion.play($('#camp-rows').firstElementChild, 'kw-reveal'); }
      },
    });
    const upd = () => { const r = reach($('#bs', el).value, $('#bc', el).value); $('#reach', el).innerHTML = `Alcance: <b>${Fmt.plural(r.ok, 'integrante', 'integrantes')}</b> com consentimento em ${$('#bc', el).value}${r.total - r.ok ? ` · ${r.total - r.ok} sem consentimento não recebem` : ''}.`; Motion.play($('#reach', el), 'kw-swap'); };
    $('#bs', el).addEventListener('change', upd); $('#bc', el).addEventListener('change', upd); upd();
  },
  async processCampaign(c){
    const paint = () => { const row = $(`[data-camp="${c.id}"]`); if (!row) return; const st = $('[data-camp-st]', row), s = MSG_STATUS[c.status]; st.className = `st ${s.cls}`; st.textContent = c.status === 'DELIVERED' || c.status === 'SENT' ? (c.channel === 'Email' ? 'Enviado' : 'Entregue') : s.label; Motion.play(st, 'kw-swap'); };
    await Http.wait(900); c.status = 'PROCESSING'; paint();
    await Http.wait(1300); c.status = Store.flags.down ? 'FAILED' : (c.channel === 'Email' ? 'SENT' : 'DELIVERED'); paint();
  },
};

      <td class="r">${x.kind === 'draft' ? `<button class="btn btn-gold btn-sm" data-nav="#/app/propostas/${x.id}">${x.status === 'DRAFT' ? 'Editar rascunho' : 'Abrir proposta'}</button>` : `<button class="btn btn-primary btn-sm" data-open-partnership="${x.id}">Acompanhar</button>`}</td></tr>`; };
    return `<h1 class="sr">Minhas propostas</h1>
    <section class="u-card"><div class="u-card-top"><div><h2 class="u-card-title">Minhas propostas e negociações</h2><p class="muted">Acompanhe o status e a próxima ação de cada parceria em andamento.</p></div><button class="btn btn-primary" id="new-proposal">${I('plus', 15)} Criar nova proposta</button></div>
      <div class="table-wrap flat"><table><caption class="sr">Propostas</caption><thead><tr><th scope="col">Parceira</th><th scope="col">Objetivo</th><th scope="col">Modalidade</th><th scope="col">Status</th><th scope="col">Data</th><th scope="col" class="r">Ação</th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table></div></section>
    <section class="u-card" style="margin-top:24px"><div class="u-card-top"><div><h2 class="u-card-title sm">Trilha de eventos</h2><p class="muted">O que o sistema registra para medir o funil: só identificadores, sem dados pessoais.</p></div></div><div id="events"></div></section>`;
  },
  mount(root){
    this.paintEvents(); Motion.reveal(root, 'tbody tr', null);
    $$('[data-open-partnership]', root).forEach(b => b.addEventListener('click', () => PartnershipModal.open(b.dataset.openPartnership)));
    $('#new-proposal', root).addEventListener('click', () => { App.navigate('#/app/oportunidades'); Toast.show('Toda proposta começa de uma oportunidade: escolha uma e toque em Criar proposta.'); });
  },
});

/* ═══ Detalhes da parceria (aceite bilateral) ═══ */
const PartnershipModal = {
  open(id){
    const p = PARTNERSHIPS.find(x => x.id === id), [sl, sc] = PSTATUS[p.status], first = Fmt.first(p.partner.name);
    const canAccept = p.status === 'NEGOTIATING' && !p.mine;
    AdminModal.open({overline:'Detalhes da parceria', title:p.partner.business, submit:canAccept ? 'Confirmar meu aceite' : null, body:`
      <span class="st ${sc}" style="align-self:flex-start">${sl}</span>
      <div class="m-box"><p><b>Objetivo:</b> ${Fmt.esc(p.objective)}</p><p><b>Participantes:</b> ${Fmt.esc(ME.name)} e ${Fmt.esc(p.partner.name)}</p><p><b>Modalidade:</b> ${MODALITY[p.modality]}</p></div>
      <div class="m-accept"><div><span class="lbl">Seu aceite</span><b>${p.mine ? `${I('check', 13)} confirmado` : 'pendente'}</b></div><div><span class="lbl">Aceite de ${first}</span><b>${p.theirs ? `${I('check', 13)} confirmado` : 'pendente'}</b></div></div>
      <h3 class="m-h" style="margin-top:8px">Histórico de atualizações e negociação</h3>
      <ol class="m-timeline">${p.history.map(([d, t, x]) => `<li><b>${shortDate(d)} · ${t}</b><p>${Fmt.esc(x)}</p></li>`).join('')}</ol>
      ${!canAccept ? `<p class="note">${p.status === 'SENT' ? `Aguardando a resposta de ${first}. Você recebe um aviso quando ela responder.` : p.status === 'ACCEPTED' ? 'A parceria só conta como efetiva quando a entrega for confirmada pelas duas partes.' : ''}</p><div class="am-foot"><button type="submit" class="btn btn-ghost">Fechar</button></div>` : `<p class="note">O aceite precisa das duas partes. Aceitar não marca a entrega como feita.</p>`}`,
      onSubmit: canAccept ? async () => { await Http.wait(600); p.mine = true; if (p.theirs){ p.status = 'ACCEPTED'; p.history.unshift([new Date().toISOString().slice(0, 10), 'Aceite das duas partes', 'A parceria foi aceita. Próximo passo: combinar e confirmar a entrega.']); }
        Telemetry.track('PARTNERSHIP_ACCEPTED_BY_INITIATOR', p.id); Toast.show('Parceria aceita pelas duas partes. A entrega ainda precisa ser confirmada.');
        const st = $(`[data-pstatus="${p.id}"]`); if (st){ st.className = `st ${PSTATUS[p.status][1]}`; st.textContent = PSTATUS[p.status][0]; Motion.play(st, 'kw-swap'); }
        if (Router.current.page === HomePage) HomePage.paint(); } : null,
    });
  },
};

/* ═══ Editor de proposta: textos da referência ═══ */
const _edRender = ProposalEditor.render.bind(ProposalEditor);
ProposalEditor.render = function(id){
  let html = _edRender(id); const d = ProposalsApi.drafts[id]; if (!d) return html;
  const c = OpportunitiesApi.byRef(d.matchRef).candidate;
  html = html.replace(`<p class="doc-kind">Proposta de parceria · ${MODALITY[d.modality]}</p>`, `<p class="doc-kind k-over">Criar proposta de parceria · ${MODALITY[d.modality]}</p>`)
             .replace(`<h1 id="doc-title" class="t-display t-h2">Proposta para ${Fmt.esc(c.name)}</h1>`, `<h1 id="doc-title" class="t-display t-h2">Formulário de alinhamento estratégico</h1><p class="doc-sub">Pré-preenchido com base no match com ${Fmt.esc(c.name)}.</p>`)
             .replace('<small>De</small>', '<small>Participantes</small>').replace('<small>Para</small>', '<small>Com</small>');
  return html;
};
